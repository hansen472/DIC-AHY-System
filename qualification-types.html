<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资质种类 - 数智中心</title>
<link rel="icon" href="http://172.19.40.91/images/Favicon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; padding: 20px; color: #333; }
.container { max-width: 1200px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
h1 { font-size: 22px; color: #2c3e50; }
button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: #2b6cb0; color: #fff; }
.btn-success { background: #38a169; color: #fff; }
.btn-secondary { background: #e2e8f0; color: #333; }
.btn-danger { background: #e53e3e; color: #fff; }
.message { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; display: none; }
.message.success { background: #c6f6d5; color: #22543d; display: block; }
.message.error { background: #fed7d7; color: #742a2a; display: block; }
.card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.card h2 { font-size: 16px; margin-bottom: 16px; color: #2c3e50; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #edf2f7; vertical-align: middle; }
th { background: #f7fafc; font-weight: 600; color: #4a5568; }
tr:hover td { background: #f7fafc; }
tr.selected td { background: #ebf4ff !important; }
.empty { text-align: center; color: #a0aec0; padding: 40px 0; }
.action-col { width: 120px; text-align: center; white-space: nowrap; }
.action-col button { padding: 4px 10px; font-size: 12px; margin: 0 2px; }
.checkbox-col { width: 40px; text-align: center; }
.status-yes { color: #38a169; font-weight: 500; }
.status-no { color: #718096; }

.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.active { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 90%; max-width: 500px; max-height: 92vh; overflow: hidden; display: flex; flex-direction: column; }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #edf2f7; }
.modal-header h3 { font-size: 16px; color: #2c3e50; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid #edf2f7; background: #fafbfc; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: #4a5568; margin-bottom: 6px; font-weight: 500; }
.form-group label .required { color: #e53e3e; margin-left: 2px; }
.form-group input, .form-group select {
  width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px;
  font-size: 14px; transition: all 0.2s; font-family: inherit;
}
.form-group input:focus, .form-group select:focus {
  outline: none; border-color: #2b6cb0; box-shadow: 0 0 0 3px rgba(43,108,176,0.1);
}
.form-group .radio-group { display: flex; gap: 20px; margin-top: 6px; }
.form-group .radio-group label { display: inline-flex; align-items: center; gap: 6px; font-weight: normal; cursor: pointer; }
.form-group .radio-group input { width: auto; }

.confirm-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1100; }
.confirm-overlay.active { display: flex; }
.confirm-box { background: #fff; border-radius: 12px; padding: 24px; width: 90%; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); }
.confirm-box h4 { font-size: 16px; margin-bottom: 12px; color: #2c3e50; }
.confirm-box p { font-size: 14px; color: #4a5568; margin-bottom: 20px; }
.confirm-box .confirm-footer { display: flex; justify-content: flex-end; gap: 10px; }

.readonly-notice { padding: 10px 14px; background: #ebf8ff; border-radius: 6px; color: #2b6cb0; font-size: 13px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>资质种类</h1>
    <div>
      <span id="current-user" style="font-size:13px; color:#4a5568; margin-right:12px;"></span>
      <button class="btn-secondary" onclick="window.location.href='/'">返回导航</button>
    </div>
  </header>

  <div id="global-message" class="message"></div>
  <div id="readonly-notice" class="readonly-notice">当前账号仅有查看权限，无法新增、修改或删除资质种类。</div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0;">资质类型列表</h2>
      <div style="display:flex; gap:10px;">
        <button class="btn-secondary" onclick="downloadCsvTemplate()">下载CSV模板</button>
        <button class="btn-success edit-only" onclick="triggerCsvUpload()">上传CSV</button>
        <input type="file" id="csv-upload-input" accept=".csv" style="display:none;" onchange="handleCsvUpload(this)">
        <button class="btn-success edit-only" onclick="openAddModal()">新增资质种类</button>
      </div>
    </div>
    <div id="qualification-list">加载中...</div>
  </div>
</div>

<div id="qualification-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">新增资质种类</h3>
      <button class="btn-secondary" onclick="closeModal()">关闭</button>
    </div>
    <div class="modal-body">
      <form id="qualification-form" onsubmit="return false;">
        <input type="hidden" id="edit-id">
        <div class="form-group">
          <label>资质名称 <span class="required">*</span></label>
          <input type="text" id="edit-name" placeholder="请输入资质名称" maxlength="200">
        </div>
        <div class="form-group">
          <label>是否需要过期检查 <span class="required">*</span></label>
          <div class="radio-group">
            <label><input type="radio" name="edit-need-expiry-check" value="1" checked> 是</label>
            <label><input type="radio" name="edit-need-expiry-check" value="0"> 否</label>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-success" id="btn-save" onclick="saveQualification()">保存</button>
    </div>
  </div>
</div>

<div id="confirm-overlay" class="confirm-overlay">
  <div class="confirm-box">
    <h4>确认删除</h4>
    <p id="confirm-text">确定要删除该资质种类吗？删除后不可恢复。</p>
    <div class="confirm-footer">
      <button class="btn-secondary" onclick="closeConfirm()">取消</button>
      <button class="btn-danger" id="btn-confirm-delete" onclick="executeDelete()">删除</button>
    </div>
  </div>
</div>

<script>
let qualificationData = [];
let selectedId = null;
let canEdit = false;
let deleteId = null;

async function init() {
  await loadUser();
  await loadPermissions();
  await loadQualifications();
}

async function loadUser() {
  try {
    const res = await fetch('/api/session');
    if (res.ok) {
      const data = await res.json();
      if (data.success && data.username) {
        document.getElementById('current-user').textContent = '当前用户：' + data.username;
      }
    }
  } catch (e) {}
}

async function loadPermissions() {
  try {
    const res = await fetch('/api/my-permissions');
    if (res.ok) {
      const data = await res.json();
      const perms = data.success ? data.permissions : {};
      canEdit = perms.supplier_qualifications_edit === true;

      document.querySelectorAll('.edit-only').forEach(btn => {
        btn.style.display = canEdit ? 'inline-block' : 'none';
      });

      if (!canEdit) {
        document.getElementById('readonly-notice').style.display = 'block';
      }
    }
  } catch (e) {
    console.error('加载权限失败:', e);
  }
}

async function loadQualifications() {
  try {
    const res = await fetch('/api/qualification-types');
    if (!res.ok) {
      let msg = '加载失败';
      try {
        const errData = await res.json();
        msg = errData.error || errData.message || ('HTTP ' + res.status);
      } catch (e) {
        msg = 'HTTP ' + res.status;
      }
      throw new Error(msg);
    }
    const result = await res.json();
    qualificationData = result.data || [];
    renderList();
  } catch (err) {
    document.getElementById('qualification-list').innerHTML = '<div class="empty">加载失败：' + escapeHtml(err.message) + '</div>';
  }
}

function renderList() {
  if (qualificationData.length === 0) {
    document.getElementById('qualification-list').innerHTML = '<div class="empty">暂无资质种类数据</div>';
    return;
  }

  let html = `<table>
    <thead>
      <tr>
        <th class="checkbox-col"><input type="checkbox" id="select-all" onclick="toggleSelectAll()"></th>
        <th>资质名称</th>
        <th>是否需要过期检查</th>
        <th class="action-col">操作</th>
      </tr>
    </thead>
    <tbody>`;

  qualificationData.forEach(item => {
    const isSelected = selectedId === item.id;
    const needCheckText = item.need_expiry_check === 1 ? '<span class="status-yes">是</span>' : '<span class="status-no">否</span>';
    html += `
      <tr class="qualification-row ${isSelected ? 'selected' : ''}" data-id="${item.id}" onclick="selectRow(${item.id})">
        <td class="checkbox-col" onclick="event.stopPropagation(); selectRow(${item.id})">
          <input type="checkbox" ${isSelected ? 'checked' : ''} onclick="event.stopPropagation(); selectRow(${item.id})">
        </td>
        <td>${escapeHtml(item.name)}</td>
        <td>${needCheckText}</td>
        <td class="action-col">
          ${isSelected && canEdit ? `
            <button class="btn-primary" onclick="event.stopPropagation(); openEditModal(${item.id})" style="padding:4px 10px; font-size:12px;">修改</button>
            <button class="btn-danger" onclick="event.stopPropagation(); confirmDelete(${item.id})" style="padding:4px 10px; font-size:12px;">删除</button>
          ` : ''}
        </td>
      </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('qualification-list').innerHTML = html;
}

function toggleSelectAll() {
  const cb = document.getElementById('select-all');
  if (cb.checked) {
    if (qualificationData.length > 0) {
      selectedId = qualificationData[0].id;
    }
  } else {
    selectedId = null;
  }
  renderList();
}

function selectRow(id) {
  selectedId = selectedId === id ? null : id;
  renderList();
}

function openAddModal() {
  if (!canEdit) return;
  document.getElementById('modal-title').textContent = '新增资质种类';
  document.getElementById('qualification-form').reset();
  document.getElementById('edit-id').value = '';
  document.getElementById('qualification-modal').classList.add('active');
}

function openEditModal(id) {
  if (!canEdit) return;
  const item = qualificationData.find(q => q.id === id);
  if (!item) return;

  document.getElementById('modal-title').textContent = '修改资质种类';
  document.getElementById('edit-id').value = item.id;
  document.getElementById('edit-name').value = item.name || '';
  const radios = document.getElementsByName('edit-need-expiry-check');
  for (const radio of radios) {
    radio.checked = String(item.need_expiry_check) === radio.value;
  }

  document.getElementById('qualification-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('qualification-modal').classList.remove('active');
}

function getNeedExpiryCheckValue() {
  const radios = document.getElementsByName('edit-need-expiry-check');
  for (const radio of radios) {
    if (radio.checked) return parseInt(radio.value, 10);
  }
  return 1;
}

async function saveQualification() {
  const id = document.getElementById('edit-id').value;
  const name = document.getElementById('edit-name').value.trim();

  if (!name) {
    showMessage('资质名称不能为空', 'error');
    return;
  }

  const payload = {
    name,
    need_expiry_check: getNeedExpiryCheckValue()
  };

  const btn = document.getElementById('btn-save');
  btn.disabled = true;

  try {
    const url = id ? '/api/qualification-types/' + id : '/api/qualification-types';
    const method = id ? 'PUT' : 'POST';
    const res = await fetch(url, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '保存失败');

    showMessage(result.message, 'success');
    closeModal();
    selectedId = null;
    await loadQualifications();
  } catch (err) {
    showMessage(err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function confirmDelete(id) {
  if (!canEdit) return;
  const item = qualificationData.find(q => q.id === id);
  deleteId = id;
  document.getElementById('confirm-text').textContent = `确定要删除资质种类 "${item ? item.name : ''}" 吗？删除后不可恢复。`;
  document.getElementById('confirm-overlay').classList.add('active');
}

function closeConfirm() {
  deleteId = null;
  document.getElementById('confirm-overlay').classList.remove('active');
}

async function executeDelete() {
  if (!deleteId) return;

  try {
    const res = await fetch('/api/qualification-types/' + deleteId, { method: 'DELETE' });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '删除失败');

    showMessage('资质种类已删除', 'success');
    closeConfirm();
    selectedId = null;
    await loadQualifications();
  } catch (err) {
    showMessage('删除失败：' + err.message, 'error');
  }
}

function showMessage(text, type) {
  const el = document.getElementById('global-message');
  el.textContent = text;
  el.className = 'message ' + type;
  setTimeout(() => { el.className = 'message'; }, 5000);
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function downloadCsvTemplate() {
  const link = document.createElement('a');
  link.href = '/api/qualification-types/template';
  link.download = 'qualification-types-template.csv';
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function triggerCsvUpload() {
  if (!canEdit) return;
  document.getElementById('csv-upload-input').click();
}

async function handleCsvUpload(input) {
  const file = input.files[0];
  input.value = '';
  if (!file || !canEdit) return;

  let text;
  try {
    text = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => resolve(e.target.result);
      reader.onerror = e => reject(new Error('读取文件失败'));
      reader.readAsText(file);
    });
  } catch (err) {
    showMessage('读取 CSV 失败：' + err.message, 'error');
    return;
  }

  try {
    const res = await fetch('/api/qualification-types/import', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ csv: text })
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '上传失败');

    showMessage(result.message, 'success');
    selectedId = null;
    await loadQualifications();
  } catch (err) {
    showMessage('上传失败：' + err.message, 'error');
  }
}

init();
</script>
</body>
</html>
