<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户管理 - 数智中心</title>
<link rel="icon" href="http://10.5.53.30/images/Favicon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; padding: 20px; color: #333; }
.container { max-width: 1400px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
h1 { font-size: 22px; color: #2c3e50; }
button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: #2b6cb0; color: #fff; }
.btn-success { background: #38a169; color: #fff; }
.btn-secondary { background: #e2e8f0; color: #333; }
.btn-danger { background: #e53e3e; color: #fff; }
.message { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; display: none; }
.message.success { background: #c6f6d5; color: #22543d; display: block; }
.message.error { background: #fed7d7; color: #742a2a; display: block; }
.card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.card h2 { font-size: 16px; margin-bottom: 16px; color: #2c3e50; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #edf2f7; }
th { background: #f7fafc; font-weight: 600; color: #4a5568; }
tr:hover td { background: #f7fafc; }
tr { cursor: pointer; }
.empty { text-align: center; color: #a0aec0; padding: 40px 0; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.badge-active { background: #c6f6d5; color: #22543d; }
.badge-inactive { background: #edf2f7; color: #4a5568; }
.badge-locked { background: #feebc8; color: #c05621; }
.badge-warn { background: #feebc8; color: #c05621; }
.badge-ok { background: #c6f6d5; color: #22543d; }
.badge-expired { background: #fed7d7; color: #9b2c2c; }
.btn-warning { background: #ed8936; color: #fff; }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 4px; }
.hint { color: #718096; font-size: 13px; margin-bottom: 12px; }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.active { display: flex; }
.modal { background: #fff; border-radius: 12px; width: 90%; max-width: 560px; max-height: 92vh; overflow: hidden; display: flex; flex-direction: column; }
.modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #edf2f7; }
.modal-header h3 { font-size: 16px; color: #2c3e50; }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; border-top: 1px solid #edf2f7; background: #fafbfc; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { margin-bottom: 4px; }
.form-group.full-width { grid-column: 1 / -1; }
.form-group label { display: block; font-size: 13px; color: #4a5568; margin-bottom: 6px; font-weight: 500; }
.form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 14px; transition: all 0.2s; }
.form-group input:focus, .form-group select:focus { outline: none; border-color: #2b6cb0; box-shadow: 0 0 0 3px rgba(43,108,176,0.1); }
.form-group .input-hint { font-size: 12px; color: #a0aec0; margin-top: 4px; }

.password-section { margin-top: 16px; padding-top: 16px; border-top: 1px solid #edf2f7; }
.password-section h4 { font-size: 14px; color: #2c3e50; margin-bottom: 12px; }
.lock-section { margin-top: 16px; padding: 14px; background: #fffaf0; border: 1px solid #fbd38d; border-radius: 8px; }
.lock-section .lock-info { display: flex; align-items: center; justify-content: space-between; }
.lock-section .lock-label { color: #c05621; font-size: 14px; font-weight: 600; }
.lock-section .lock-time { color: #744210; font-size: 13px; margin-top: 4px; }
.pwd-warn-section { background: #fffaf0; border-color: #fbd38d; }
.pwd-expired-section { background: #fff5f5; border-color: #feb2b2; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>用户管理</h1>
    <div>
      <span id="current-user" style="font-size:13px; color:#4a5568; margin-right:12px;"></span>
      <button class="btn-success" onclick="openAddModal()" style="margin-right:8px;">新增员工</button>
      <button class="btn-secondary" onclick="window.location.href='/'">返回导航</button>
    </div>
  </header>

  <div id="global-message" class="message"></div>

  <div class="card">
    <h2>人员列表</h2>
    <p class="hint">提示：双击某行可编辑该员工信息。</p>
    <div id="user-list">加载中...</div>
  </div>
</div>

<!-- 新增/编辑员工弹窗 -->
<div id="user-modal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">编辑员工信息</h3>
      <button class="btn-secondary" onclick="closeModal()">关闭</button>
    </div>
    <div class="modal-body">
      <form id="user-form" onsubmit="return false;">
        <input type="hidden" id="edit-username">
        <div class="form-grid">
          <div class="form-group">
            <label>用户名 <span style="color:#e53e3e;">*</span></label>
            <input type="text" id="edit-username-input" placeholder="请输入用户名" maxlength="50">
          </div>
          <div class="form-group">
            <label>中文名</label>
            <input type="text" id="edit-chinese-name" placeholder="请输入中文名" maxlength="50">
          </div>
          <div class="form-group">
            <label>公司名称</label>
            <select id="edit-company-id">
              <option value="">— 请选择公司 —</option>
            </select>
          </div>
          <div class="form-group">
            <label>部门</label>
            <select id="edit-department-id">
              <option value="">— 请选择部门 —</option>
            </select>
          </div>
          <div class="form-group">
            <label>岗位</label>
            <input type="text" id="edit-position" placeholder="请输入岗位" maxlength="100">
          </div>
          <div class="form-group">
            <label>直接上级</label>
            <select id="edit-direct-manager-username">
              <option value="">— 请选择直接上级 —</option>
            </select>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="edit-email" placeholder="请输入邮箱" maxlength="100">
          </div>
          <div class="form-group">
            <label>入职日期</label>
            <input type="date" id="edit-hire-date">
          </div>
          <div class="form-group">
            <label>状态</label>
            <select id="edit-status">
              <option value="1">启用</option>
              <option value="0">禁用</option>
            </select>
          </div>
        </div>

        <div class="password-section" id="password-section" style="display:none;">
          <h4>设置密码</h4>
          <div class="form-grid">
            <div class="form-group full-width">
              <label>密码 <span style="color:#e53e3e;">*</span></label>
              <input type="password" id="edit-password" placeholder="请输入密码">
              <div class="input-hint">至少 6 位，须含字母和数字，连续字母/数字不超过 3 位，不可含用户名</div>
            </div>
          </div>
        </div>

        <div class="password-section" id="change-password-section" style="display:none;">
          <h4>修改密码</h4>
          <div class="form-grid">
            <div class="form-group full-width">
              <label>新密码</label>
              <input type="password" id="edit-new-password" placeholder="不修改请留空">
              <div class="input-hint">至少 6 位，须含字母和数字，连续字母/数字不超过 3 位，不可含用户名</div>
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">取消</button>
      <button class="btn-success" id="btn-save" onclick="saveUser()">保存</button>
    </div>
  </div>
</div>

<script>
let usersData = [];
let companiesList = [];
let departmentsList = [];
let managerOptions = [];
let isEditMode = false;

async function init() {
  await Promise.all([loadCompaniesList(), loadDepartmentsList(), loadManagerOptions()]);
  await loadUser();
  await loadUsers();
}

async function loadCompaniesList() {
  try {
    const res = await fetch('/api/companies');
    if (res.ok) {
      const result = await res.json();
      companiesList = result.data || [];
      const select = document.getElementById('edit-company-id');
      select.innerHTML = '<option value="">— 请选择公司 —</option>';
      companiesList.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.company_name;
        select.appendChild(opt);
      });
    }
  } catch (e) {}
}

async function loadDepartmentsList() {
  try {
    const res = await fetch('/api/departments');
    if (res.ok) {
      const result = await res.json();
      departmentsList = result.data || [];
      const select = document.getElementById('edit-department-id');
      select.innerHTML = '<option value="">— 请选择部门 —</option>';
      departmentsList.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        const label = d.company_name ? d.department_name + ' (' + d.company_name + ')' : d.department_name;
        opt.textContent = label;
        select.appendChild(opt);
      });
    }
  } catch (e) {}
}

async function loadManagerOptions() {
  try {
    const res = await fetch('/api/users');
    if (res.ok) {
      const result = await res.json();
      managerOptions = (result.data || []).filter(u => u.username !== 'admin' && u.status === 1);
      const select = document.getElementById('edit-direct-manager-username');
      select.innerHTML = '<option value="">— 请选择直接上级 —</option>';
      managerOptions.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u.username;
        opt.textContent = u.chinese_name ? u.chinese_name + ' (' + u.username + ')' : u.username;
        select.appendChild(opt);
      });
    }
  } catch (e) {}
}

async function loadUser() {
  try {
    const res = await fetch('/api/session');
    if (res.ok) {
      const data = await res.json();
      if (data.success && data.username) {
        document.getElementById('current-user').textContent = '当前用户：' + data.username;
      }
    }
  } catch (e) {}
}

async function loadUsers() {
  try {
    const res = await fetch('/api/users');
    if (!res.ok) {
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || '加载失败');
    }
    const result = await res.json();
    usersData = result.data || [];
    renderUserList();
  } catch (err) {
    document.getElementById('user-list').innerHTML = '<div class="empty">加载失败：' + err.message + '</div>';
  }
}

function renderUserList() {
  if (usersData.length === 0) {
    document.getElementById('user-list').innerHTML = '<div class="empty">暂无用户数据</div>';
    return;
  }

  let html = `<table>
    <thead>
      <tr>
        <th>用户名</th>
        <th>中文名</th>
        <th>公司名称</th>
        <th>部门</th>
        <th>岗位</th>
        <th>直接上级</th>
        <th>Email</th>
        <th>入职日期</th>
        <th>状态</th>
        <th>密码有效期</th>
        <th>账户锁定</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>`;

  usersData.forEach(u => {
    const statusClass = u.status === 1 ? 'badge-active' : 'badge-inactive';
    const statusText = u.status === 1 ? '启用' : '禁用';

    // 判断锁定状态
    let lockBadge = '';
    let unlockBtn = '';
    if (u.locked_until) {
      const lockedUntil = new Date(u.locked_until.replace(' ', 'T')); // 兼容 MariaDB dateStrings 格式
      if (lockedUntil > new Date()) {
        const remainMin = Math.ceil((lockedUntil - new Date()) / 60000);
        lockBadge = `<span class="badge badge-locked">🔒 已锁定 (${remainMin}分钟)</span>`;
        unlockBtn = `<button class="btn-warning btn-sm" onclick="event.stopPropagation(); unlockUser('${escapeHtml(u.username)}')">解锁</button>`;
      } else {
        lockBadge = '<span class="badge badge-active">正常</span>';
      }
    } else {
      lockBadge = '<span class="badge badge-active">正常</span>';
    }

    // 计算密码有效期状态
    let pwdBadge = '';
    if (u.password_changed_at) {
      const changedAt = new Date(u.password_changed_at.replace(' ', 'T'));
      const daysSince = Math.floor((Date.now() - changedAt.getTime()) / 86400000);
      const daysLeft = 365 - daysSince; // 距过期还剩多少天
      if (daysLeft > 30) {
        // 正常状态
        pwdBadge = `<span class="badge badge-ok">剩余 ${daysLeft} 天</span>`;
      } else if (daysLeft > 0) {
        // 即将过期（不足30天）
        pwdBadge = `<span class="badge badge-warn">⚠ 剩余 ${daysLeft} 天</span>`;
      } else if (daysLeft > -30) {
        // 宽限期内
        const graceDaysLeft = 30 + daysLeft;
        pwdBadge = `<span class="badge badge-expired">宽限期 ${graceDaysLeft} 天</span>`;
      } else {
        // 已过期超过宽限期
        pwdBadge = '<span class="badge badge-expired">已过期</span>';
      }
    } else {
      pwdBadge = '<span class="badge badge-ok">-</span>';
    }

    html += `
      <tr ondblclick="openEditModal('${escapeHtml(u.username)}')">
        <td>${escapeHtml(u.username)}</td>
        <td>${escapeHtml(u.chinese_name)}</td>
        <td>${escapeHtml(u.company_name)}</td>
        <td>${escapeHtml(u.dept_name || u.department)}</td>
        <td>${escapeHtml(u.position)}</td>
        <td>${escapeHtml(u.direct_manager_name || u.direct_manager)}</td>
        <td>${escapeHtml(u.email)}</td>
        <td>${formatDate(u.hire_date)}</td>
        <td><span class="badge ${statusClass}">${statusText}</span></td>
        <td>${pwdBadge}</td>
        <td>${lockBadge}</td>
        <td>${unlockBtn}</td>
      </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('user-list').innerHTML = html;
}

function openAddModal() {
  isEditMode = false;
  document.getElementById('modal-title').textContent = '新增员工';
  document.getElementById('user-form').reset();
  document.getElementById('edit-username').value = '';
  document.getElementById('edit-status').value = '1';
  document.getElementById('edit-company-id').value = '';
  document.getElementById('edit-department-id').value = '';
  document.getElementById('edit-direct-manager-username').value = '';

  document.getElementById('edit-username-input').disabled = false;
  document.getElementById('password-section').style.display = 'block';
  document.getElementById('change-password-section').style.display = 'none';

  document.getElementById('user-modal').classList.add('active');
}

async function openEditModal(username) {
  isEditMode = true;
  document.getElementById('modal-title').textContent = '编辑员工信息';
  document.getElementById('user-form').reset();

  document.getElementById('edit-username-input').disabled = true;
  document.getElementById('password-section').style.display = 'none';
  document.getElementById('change-password-section').style.display = 'block';

  try {
    const res = await fetch('/api/users/' + encodeURIComponent(username));
    if (!res.ok) throw new Error('加载失败');
    const result = await res.json();
    const u = result.data;

    document.getElementById('edit-username').value = u.username;
    document.getElementById('edit-username-input').value = u.username;
    document.getElementById('edit-chinese-name').value = u.chinese_name || '';
    document.getElementById('edit-company-id').value = u.company_id || '';
    document.getElementById('edit-department-id').value = u.department_id || '';
    document.getElementById('edit-position').value = u.position || '';
    document.getElementById('edit-direct-manager-username').value = u.direct_manager_username || '';
    document.getElementById('edit-email').value = u.email || '';
    document.getElementById('edit-hire-date').value = formatDateInput(u.hire_date);
    document.getElementById('edit-status').value = String(u.status);

    // 管理员账号不允许在界面上禁用
    const isAdmin = u.username === 'admin';
    document.getElementById('edit-status').disabled = isAdmin;

    // 显示密码有效期信息
    let pwdSection = document.getElementById('pwd-section');
    if (u.password_changed_at) {
      const changedAt = new Date(u.password_changed_at.replace(' ', 'T'));
      const daysSince = Math.floor((Date.now() - changedAt.getTime()) / 86400000);
      const daysLeft = 365 - daysSince;
      let pwdStatusText = '';
      let pwdStatusClass = '';
      if (daysLeft > 30) {
        pwdStatusText = `✅ 密码有效，剩余 ${daysLeft} 天`;
        pwdStatusClass = 'lock-section';
      } else if (daysLeft > 0) {
        pwdStatusText = `⚠️ 密码即将过期，剩余 ${daysLeft} 天`;
        pwdStatusClass = 'lock-section pwd-warn-section';
      } else if (daysLeft > -30) {
        pwdStatusText = `⚠️ 宽限期剩余 ${30 + daysLeft} 天，请尽快修改密码`;
        pwdStatusClass = 'lock-section pwd-warn-section';
      } else {
        pwdStatusText = `❌ 密码已过期 ${Math.abs(daysLeft) - 30} 天，账户已被锁定`;
        pwdStatusClass = 'lock-section pwd-expired-section';
      }
      if (!pwdSection) {
        pwdSection = document.createElement('div');
        pwdSection.id = 'pwd-section';
        // 插入到 lock-section 之前
        const lockSectionEl = document.getElementById('lock-section');
        const formEl = document.getElementById('user-form');
        if (lockSectionEl) {
          formEl.insertBefore(pwdSection, lockSectionEl);
        } else {
          formEl.appendChild(pwdSection);
        }
      }
      pwdSection.className = pwdStatusClass;
      pwdSection.innerHTML = `
        <div class="lock-info">
          <div>
            <div class="lock-label" style="font-size:13px;">${pwdStatusText}</div>
            <div class="lock-time">密码修改时间：${u.password_changed_at}</div>
          </div>
          <button class="btn-warning btn-sm" onclick="resetPasswordExpiry('${escapeHtml(u.username)}')">重置有效期</button>
        </div>`;
      pwdSection.style.display = 'block';
    } else {
      if (pwdSection) pwdSection.style.display = 'none';
    }

    // 显示锁定状态信息
    let lockSection = document.getElementById('lock-section');
    if (u.locked_until) {
      const lockedUntil = new Date(u.locked_until.replace(' ', 'T'));
      if (lockedUntil > new Date()) {
        const remainMin = Math.ceil((lockedUntil - new Date()) / 60000);
        if (!lockSection) {
          lockSection = document.createElement('div');
          lockSection.id = 'lock-section';
          lockSection.className = 'lock-section';
          document.getElementById('user-form').appendChild(lockSection);
        }
        lockSection.innerHTML = `
          <div class="lock-info">
            <div>
              <div class="lock-label">🔒 账户已锁定</div>
              <div class="lock-time">剩余 ${remainMin} 分钟自动解锁（${u.locked_until}）</div>
            </div>
            <button class="btn-warning" onclick="unlockUserFromModal('${escapeHtml(u.username)}')">立即解锁</button>
          </div>`;
        lockSection.style.display = 'block';
      } else {
        if (lockSection) lockSection.style.display = 'none';
      }
    } else {
      if (lockSection) lockSection.style.display = 'none';
    }

    document.getElementById('user-modal').classList.add('active');
  } catch (err) {
    showMessage('加载用户信息失败：' + err.message, 'error');
  }
}

function closeModal() {
  document.getElementById('user-modal').classList.remove('active');
}

/**
 * 前端密码复杂度校验（与 server.js validatePassword 逻辑一致）
 */
function validatePassword(password, username) {
  if (!password || password.length < 6) return '密码长度不能少于 6 位';
  if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) return '密码必须同时包含字母和数字';
  // 检查连续字母/数字序列（如 abcd、dcba、1234、4321）
  const lower = password.toLowerCase();
  let asc = 1, desc = 1;
  for (let i = 1; i < lower.length; i++) {
    const prev = lower.charCodeAt(i - 1), curr = lower.charCodeAt(i);
    const pL = prev >= 97 && prev <= 122, cL = curr >= 97 && curr <= 122;
    const pD = prev >= 48 && prev <= 57, cD = curr >= 48 && curr <= 57;
    if ((pL && cL) || (pD && cD)) {
      if (curr - prev === 1) { asc++; desc = 1; }
      else if (prev - curr === 1) { desc++; asc = 1; }
      else { asc = 1; desc = 1; }
    } else { asc = 1; desc = 1; }
    if (asc > 3 || desc > 3) return '密码中连续字母或数字不能超过 3 个（如 abcd、1234）';
  }
  if (username && username.trim()) {
    const un = username.trim();
    const variants = [un, un.toLowerCase(), un.toUpperCase(), un.split('').reverse().join('')]
      .filter(v => v && v.length > 0);
    const unique = [...new Set(variants)];
    const pwdLower = password.toLowerCase();
    for (const v of unique) {
      if (password.includes(v) || pwdLower.includes(v.toLowerCase())) {
        return '密码不能包含用户名或用户名的变体';
      }
    }
  }
  return null;
}

async function saveUser() {
  const username = document.getElementById('edit-username-input').value.trim();
  const chineseName = document.getElementById('edit-chinese-name').value.trim();
  const companyId = document.getElementById('edit-company-id').value;
  const departmentId = document.getElementById('edit-department-id').value;
  // Look up department display name for text column
  const selectedDept = departmentsList.find(d => d.id == departmentId);
  const department = selectedDept ? selectedDept.department_name : '';
  const position = document.getElementById('edit-position').value.trim();
  const directManagerUsername = document.getElementById('edit-direct-manager-username').value;
  const selectedManager = managerOptions.find(u => u.username === directManagerUsername);
  const directManager = selectedManager ? (selectedManager.chinese_name || selectedManager.username) : '';
  const email = document.getElementById('edit-email').value.trim();
  const hireDate = document.getElementById('edit-hire-date').value;
  const status = parseInt(document.getElementById('edit-status').value, 10);

  if (!username) {
    showMessage('请输入用户名', 'error');
    return;
  }

  if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMessage('Email 格式不正确', 'error');
    return;
  }

  const btn = document.getElementById('btn-save');
  btn.disabled = true;

  try {
    if (isEditMode) {
      const originalUsername = document.getElementById('edit-username').value;

      // 更新档案
      const profileRes = await fetch('/api/users/' + encodeURIComponent(originalUsername), {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chinese_name: chineseName,
          company_id: companyId || null,
          department: department,
          department_id: departmentId || null,
          direct_manager: directManager,
          direct_manager_username: directManagerUsername || null,
          email: email,
          position: position,
          hire_date: hireDate
        })
      });
      const profileResult = await profileRes.json();
      if (!profileRes.ok) throw new Error(profileResult.error || '保存失败');

      // 更新状态
      const currentUser = usersData.find(u => u.username === originalUsername);
      if (currentUser && currentUser.status !== status && originalUsername !== 'admin') {
        const statusRes = await fetch('/api/users/' + encodeURIComponent(originalUsername) + '/status', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: status })
        });
        const statusResult = await statusRes.json();
        if (!statusRes.ok) throw new Error(statusResult.error || '状态更新失败');
      }

      // 修改密码（如有填写）
      const newPassword = document.getElementById('edit-new-password').value;
      if (newPassword) {
        const pwdErr = validatePassword(newPassword, originalUsername);
        if (pwdErr) throw new Error(pwdErr);
        const pwdRes = await fetch('/api/users/' + encodeURIComponent(originalUsername) + '/password', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: newPassword })
        });
        const pwdResult = await pwdRes.json();
        if (!pwdRes.ok) throw new Error(pwdResult.error || '密码修改失败');
      }

      showMessage('用户信息已更新', 'success');
    } else {
      const password = document.getElementById('edit-password').value;
      if (!password) {
        showMessage('请输入密码', 'error');
        btn.disabled = false;
        return;
      }
      const pwdErr = validatePassword(password, username);
      if (pwdErr) {
        showMessage(pwdErr, 'error');
        btn.disabled = false;
        return;
      }

      const res = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: username,
          password: password,
          chinese_name: chineseName,
          company_id: companyId || null,
          department: department,
          department_id: departmentId || null,
          direct_manager: directManager,
          direct_manager_username: directManagerUsername || null,
          email: email,
          position: position,
          hire_date: hireDate
        })
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.error || '创建失败');

      showMessage('员工已创建', 'success');
    }

    closeModal();
    await loadUsers();
  } catch (err) {
    showMessage(err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function showMessage(text, type) {
  const el = document.getElementById('global-message');
  el.textContent = text;
  el.className = 'message ' + type;
  setTimeout(() => { el.className = 'message'; }, 4000);
}

function formatDate(str) {
  if (!str) return '-';
  const d = new Date(str);
  if (isNaN(d.getTime())) return str;
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function formatDateInput(str) {
  if (!str) return '';
  const d = new Date(str);
  if (isNaN(d.getTime())) return '';
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

async function unlockUser(username) {
  if (!confirm(`确定要解锁用户 "${username}" 的账户吗？`)) return;
  try {
    const res = await fetch('/api/users/' + encodeURIComponent(username) + '/unlock', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' }
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '解锁失败');
    showMessage(`用户 ${username} 的账户已解锁`, 'success');
    await loadUsers();
  } catch (err) {
    showMessage('解锁失败：' + err.message, 'error');
  }
}

async function unlockUserFromModal(username) {
  if (!confirm(`确定要解锁用户 "${username}" 的账户吗？`)) return;
  try {
    const res = await fetch('/api/users/' + encodeURIComponent(username) + '/unlock', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' }
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '解锁失败');
    showMessage(`用户 ${username} 的账户已解锁`, 'success');
    // 隐藏锁定区域
    const lockSection = document.getElementById('lock-section');
    if (lockSection) lockSection.style.display = 'none';
    await loadUsers();
  } catch (err) {
    showMessage('解锁失败：' + err.message, 'error');
  }
}

// 重置密码有效期（管理员操作，将密码修改时间重置为当前时间）
async function resetPasswordExpiry(username) {
  if (!confirm(`确定要重置用户 "${username}" 的密码有效期吗？\n这将重新开始计算 1 年有效期。`)) return;
  try {
    // 通过解锁接口重置，因为解锁接口已经会同时重置 password_changed_at
    const res = await fetch('/api/users/' + encodeURIComponent(username) + '/unlock', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' }
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '重置失败');
    showMessage(`用户 ${username} 的密码有效期已重置`, 'success');
    // 关闭弹窗并刷新列表
    closeModal();
    await loadUsers();
  } catch (err) {
    showMessage('重置失败：' + err.message, 'error');
  }
}
