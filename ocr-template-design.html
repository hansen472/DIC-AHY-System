<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表单字段标定 - 数智中心</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='15' fill='%23ff4d00'/%3E%3Ctext x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='Arial'%3EO%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/fonts/jetbrains-mono.css">
<style>

:root {
  --bg: #0f1115;
  --surface: #181b21;
  --surface-2: #1f232a;
  --border: #2a2e36;
  --text: #e4e6eb;
  --text-secondary: #9ca3af;
  --accent: #ff4d00;
  --accent-hover: #ff6a22;
  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --radius: 10px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow: hidden;
}

header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 60px;
}

header h1 {
  font-size: 18px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 10px;
}

header h1::before {
  content: '';
  width: 6px; height: 18px;
  background: var(--accent);
  border-radius: 2px;
}

.header-actions {
  display: flex; align-items: center; gap: 16px;
}

#current-user {
  font-size: 13px; color: var(--text-secondary);
  font-family: "JetBrains Mono", Consolas, monospace;
}

.btn {
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s ease;
  font-family: inherit;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 500; }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }
.btn-danger { border-color: rgba(239,68,68,0.5); color: #fca5a5; }
.btn-danger:hover { background: rgba(239,68,68,0.15); color: #ef4444; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.workspace {
  display: grid;
  grid-template-columns: 360px 1fr;
  height: calc(100vh - 60px);
}

@media (max-width: 1000px) {
  .workspace { grid-template-columns: 1fr; height: auto; }
}

.panel {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 18px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.section h3 {
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text-secondary);
  margin-bottom: 10px;
}

.drop-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 24px 12px;
  text-align: center;
  color: var(--text-secondary);
  cursor: pointer;
  background: var(--surface-2);
  transition: all 0.2s;
}
.drop-zone:hover { border-color: var(--accent); color: var(--text); }
.drop-zone input { display: none; }

.field-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.field-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface-2);
  cursor: pointer;
  transition: all 0.15s;
}
.field-item:hover { border-color: var(--accent); }
.field-item.active {
  border-color: var(--accent);
  background: rgba(255, 77, 0, 0.10);
}
.field-item .idx {
  font-family: "JetBrains Mono", Consolas, monospace;
  font-size: 11px; color: var(--text-secondary);
  width: 20px;
}
.field-item .name {
  flex: 1; font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.field-item .actions { display: flex; gap: 4px; }
.field-item .actions button {
  padding: 2px 6px; font-size: 11px; background: transparent; border: 1px solid var(--border);
  color: var(--text-secondary); border-radius: 4px; cursor: pointer;
}
.field-item .actions button:hover { color: var(--text); border-color: var(--text-secondary); }

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

input, select, textarea {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  font-family: "JetBrains Mono", Consolas, monospace;
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

.full { grid-column: 1 / -1; }

.checkbox-row {
  display: flex; align-items: center; gap: 8px;
  margin-top: 6px;
}
.checkbox-row input { width: auto; }
.checkbox-row label { margin: 0; }

.action-row {
  display: flex; gap: 10px; flex-wrap: wrap;
}

.message {
  padding: 10px 12px;
  border-radius: var(--radius);
  font-size: 12px;
  display: none;
  border-left: 4px solid transparent;
}
.message.show { display: block; }
.message.success { background: rgba(16,185,129,0.12); border-color: var(--success); color: #6ee7b7; }
.message.error { background: rgba(239,68,68,0.12); border-color: var(--danger); color: #fca5a5; }
.message.info { background: rgba(59,130,246,0.12); border-color: #3b82f6; color: #93c5fd; }

.canvas-area {
  background: #0a0b0e;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: auto;
  position: relative;
}

.canvas-hint {
  position: absolute;
  top: 16px; left: 16px;
  color: var(--text-secondary);
  font-size: 12px;
  background: rgba(0,0,0,0.6);
  padding: 8px 12px;
  border-radius: 8px;
  pointer-events: none;
}

canvas {
  background: #000;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
  border: 1px solid var(--border);
  cursor: crosshair;
  max-width: 95%;
  max-height: 90vh;
}
</style>
</head>
<body>
<header>
  <h1>表单字段标定</h1>
  <div class="header-actions">
    <span id="current-user"></span>
    <button class="btn" onclick="location.href='/'">返回导航</button>
  </div>
</header>

<div class="workspace">
  <div class="panel">
    <div class="message" id="msg"></div>

    <div class="section">
      <h3>模板图片</h3>
      <label class="drop-zone" id="drop-zone">
        <input type="file" id="file-input" accept="image/jpeg,image/png,image/jpg">
        <div>点击或拖拽上传正视图</div>
      </label>
    </div>

    <div class="section">
      <h3>字段列表</h3>
      <div class="action-row">
        <button class="btn" onclick="addField()">+ 添加字段</button>
        <button class="btn" onclick="loadConfig()">加载服务器配置</button>
      </div>
      <div class="field-list" id="field-list" style="margin-top:10px;">
        <div style="color:var(--text-secondary);font-size:13px;padding:8px 0;">暂无字段，在右侧图片上框选或点击“添加字段”</div>
      </div>
    </div>

    <div class="section" id="editor-section" style="display:none;">
      <h3>字段属性</h3>
      <div class="form-grid">
        <div class="full"><label>字段标识（name）</label><input type="text" id="f-name" placeholder="如 company_name"></div>
        <div class="full"><label>显示名称（label）</label><input type="text" id="f-label" placeholder="如 公司名称"></div>
        <div><label>X</label><input type="number" id="f-x" step="0.001" min="0" max="1"></div>
        <div><label>Y</label><input type="number" id="f-y" step="0.001" min="0" max="1"></div>
        <div><label>宽度 W</label><input type="number" id="f-w" step="0.001" min="0" max="1"></div>
        <div><label>高度 H</label><input type="number" id="f-h" step="0.001" min="0" max="1"></div>
      </div>
    </div>

    <div class="section" id="validation-section" style="display:none;">
      <h3>校验规则</h3>
      <div class="form-grid">
        <div class="full"><label>类型</label>
          <select id="v-type">
            <option value="">字符串</option>
            <option value="integer">整数</option>
            <option value="number">数字</option>
            <option value="date">日期</option>
          </select>
        </div>
        <div class="full checkbox-row">
          <input type="checkbox" id="v-required"><label for="v-required">必填</label>
        </div>
        <div><label>最小值 / 最短长度</label><input type="text" id="v-min" placeholder="数字"></div>
        <div><label>最大值 / 最长长度</label><input type="text" id="v-max" placeholder="数字"></div>
        <div><label>正则表达式</label><input type="text" id="v-pattern" placeholder="可选"></div>
        <div class="full"><label>固定选项（用逗号分隔）</label><input type="text" id="v-options" placeholder="如 是,否,合格,不合格"></div>
      </div>
    </div>

    <div class="section" id="advanced-validation-section">
      <h3>高级业务校验</h3>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div>
          <label>数据库查询（db_lookups）</label>
          <textarea id="adv-db-lookups" rows="6" placeholder="[ { name: 'product_info', enabled: false, db: 'mssql', ... } ]"></textarea>
        </div>
        <div>
          <label>跨字段比较（cross_field_rules）</label>
          <textarea id="adv-cross-rules" rows="6" placeholder="[ { target_field: 'model', enabled: false, condition: {...}, message: '' } ]"></textarea>
        </div>
      </div>
    </div>

    <div class="section">
      <h3>操作</h3>
      <div class="action-row">
        <button class="btn btn-primary" onclick="saveConfig()">保存到服务器</button>
        <button class="btn" onclick="exportJson()">导出 fields.json</button>
      </div>
    </div>
  </div>

  <div class="canvas-area">
    <div class="canvas-hint">在图片上拖拽绘制字段框；点击已有框选中，可拖动或拖动右下角调整大小</div>
    <canvas id="canvas"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const fileInput = document.getElementById('file-input');
const dropZone = document.getElementById('drop-zone');
const fieldListEl = document.getElementById('field-list');
const editorSection = document.getElementById('editor-section');
const validationSection = document.getElementById('validation-section');
const msgEl = document.getElementById('msg');

let img = null;
let fields = [];
let selectedIndex = -1;
let scale = 1; // canvas.width / naturalWidth
let mode = null; // 'create' | 'move' | 'resize'
let dragStart = null; // {relX, relY}
let dragFieldStart = null; // {x,y,w,h}

const inputs = {
  name: document.getElementById('f-name'),
  label: document.getElementById('f-label'),
  x: document.getElementById('f-x'),
  y: document.getElementById('f-y'),
  w: document.getElementById('f-w'),
  h: document.getElementById('f-h'),
  type: document.getElementById('v-type'),
  required: document.getElementById('v-required'),
  min: document.getElementById('v-min'),
  max: document.getElementById('v-max'),
  pattern: document.getElementById('v-pattern'),
  options: document.getElementById('v-options'),
};

const advDbLookupsEl = document.getElementById('adv-db-lookups');
const advCrossRulesEl = document.getElementById('adv-cross-rules');

function showMsg(text, type='info') {
  msgEl.textContent = text;
  msgEl.className = 'message show ' + type;
}
function hideMsg() { msgEl.className = 'message'; }

async function loadUser() {
  try {
    const res = await fetch('/api/session');
    if (res.ok) {
      const data = await res.json();
      if (data.success && data.username) document.getElementById('current-user').textContent = data.username;
    }
  } catch(e){}
}

function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

function getMouseRel(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) / rect.width;
  const y = (e.clientY - rect.top) / rect.height;
  return { x: clamp(x, 0, 1), y: clamp(y, 0, 1) };
}

function fitCanvas() {
  const area = canvas.parentElement;
  const maxW = Math.max(400, area.clientWidth * 0.95);
  const maxH = Math.max(300, area.clientHeight * 0.9);
  if (!img) {
    canvas.width = maxW; canvas.height = maxH;
    return;
  }
  const aspect = img.naturalWidth / img.naturalHeight;
  let w = maxW, h = w / aspect;
  if (h > maxH) { h = maxH; w = h * aspect; }
  canvas.width = Math.floor(w);
  canvas.height = Math.floor(h);
  scale = canvas.width / img.naturalWidth;
  draw();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (img) {
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  }

  const W = canvas.width, H = canvas.height;
  for (let i = 0; i < fields.length; i++) {
    const f = fields[i];
    const x = f.x * W, y = f.y * H, w = f.w * W, h = f.h * H;
    const active = i === selectedIndex;

    ctx.strokeStyle = active ? '#ff4d00' : 'rgba(255, 77, 0, 0.7)';
    ctx.lineWidth = active ? 2.5 : 1.5;
    ctx.strokeRect(x, y, w, h);

    ctx.fillStyle = active ? 'rgba(255, 77, 0, 0.18)' : 'rgba(255, 77, 0, 0.10)';
    ctx.fillRect(x, y, w, h);

    // label
    ctx.fillStyle = '#fff';
    ctx.font = '12px "JetBrains Mono", Consolas, monospace';
    const text = `${i + 1}. ${f.label || f.name}`;
    const pad = 4;
    const tw = ctx.measureText(text).width;
    ctx.fillStyle = active ? 'rgba(255, 77, 0, 0.9)' : 'rgba(255, 77, 0, 0.7)';
    ctx.fillRect(x, y - 20, tw + pad * 2, 20);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, x + pad, y - 5);

    if (active) {
      // resize handle bottom-right
      ctx.fillStyle = '#ff4d00';
      ctx.fillRect(x + w - 6, y + h - 6, 12, 12);
    }
  }
}

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) {
    showMsg('请选择 JPG/PNG 图片', 'error'); return;
  }
  const url = URL.createObjectURL(file);
  img = new Image();
  img.onload = () => {
    fitCanvas();
    hideMsg();
  };
  img.src = url;
}

fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--accent)'; });
dropZone.addEventListener('dragleave', () => { dropZone.style.borderColor = ''; });
dropZone.addEventListener('drop', (e) => {
  e.preventDefault(); dropZone.style.borderColor = '';
  handleFile(e.dataTransfer.files[0]);
});

function fieldAt(rel) {
  // return topmost (last) field containing point
  for (let i = fields.length - 1; i >= 0; i--) {
    const f = fields[i];
    if (rel.x >= f.x && rel.x <= f.x + f.w && rel.y >= f.y && rel.y <= f.y + f.h) return i;
  }
  return -1;
}

function nearResizeHandle(rel) {
  if (selectedIndex < 0) return false;
  const f = fields[selectedIndex];
  const handleX = f.x + f.w;
  const handleY = f.y + f.h;
  const thr = 12 / canvas.width; // relative threshold
  return Math.abs(rel.x - handleX) < thr && Math.abs(rel.y - handleY) < thr;
}

canvas.addEventListener('mousedown', (e) => {
  if (!img) return;
  const rel = getMouseRel(e);

  if (nearResizeHandle(rel)) {
    mode = 'resize';
    dragStart = rel;
    dragFieldStart = { ...fields[selectedIndex] };
    return;
  }

  const idx = fieldAt(rel);
  if (idx >= 0) {
    selectField(idx);
    mode = 'move';
    dragStart = rel;
    dragFieldStart = { ...fields[selectedIndex] };
    return;
  }

  // create new
  mode = 'create';
  dragStart = rel;
  const newField = {
    name: 'field_' + (fields.length + 1),
    label: '字段 ' + (fields.length + 1),
    x: rel.x, y: rel.y, w: 0, h: 0,
    validation: {}
  };
  fields.push(newField);
  selectedIndex = fields.length - 1;
  refreshUI();
});

window.addEventListener('mousemove', (e) => {
  if (!mode || !img) return;
  const rel = getMouseRel(e);
  const f = fields[selectedIndex];

  if (mode === 'create') {
    f.x = Math.min(dragStart.x, rel.x);
    f.y = Math.min(dragStart.y, rel.y);
    f.w = Math.abs(rel.x - dragStart.x);
    f.h = Math.abs(rel.y - dragStart.y);
  } else if (mode === 'move') {
    const dx = rel.x - dragStart.x;
    const dy = rel.y - dragStart.y;
    f.x = clamp(dragFieldStart.x + dx, 0, 1 - f.w);
    f.y = clamp(dragFieldStart.y + dy, 0, 1 - f.h);
  } else if (mode === 'resize') {
    const dx = rel.x - dragStart.x;
    const dy = rel.y - dragStart.y;
    f.w = clamp(dragFieldStart.w + dx, 0.005, 1 - f.x);
    f.h = clamp(dragFieldStart.h + dy, 0.005, 1 - f.y);
  }
  syncEditor();
  draw();
});

window.addEventListener('mouseup', () => {
  if (mode === 'create' && selectedIndex >= 0) {
    const f = fields[selectedIndex];
    if (f.w < 0.01 || f.h < 0.01) {
      fields.splice(selectedIndex, 1);
      selectedIndex = -1;
      refreshUI();
    }
  }
  mode = null;
  dragStart = null;
  dragFieldStart = null;
});

function selectField(index) {
  selectedIndex = index;
  refreshUI();
}

function addField() {
  fields.push({
    name: 'field_' + (fields.length + 1),
    label: '字段 ' + (fields.length + 1),
    x: 0.1, y: 0.1, w: 0.15, h: 0.05,
    validation: {}
  });
  selectedIndex = fields.length - 1;
  refreshUI();
}

function deleteField(index, e) {
  if (e) e.stopPropagation();
  fields.splice(index, 1);
  if (selectedIndex === index) selectedIndex = -1;
  else if (selectedIndex > index) selectedIndex--;
  refreshUI();
}

function moveField(index, delta, e) {
  if (e) e.stopPropagation();
  const newIndex = index + delta;
  if (newIndex < 0 || newIndex >= fields.length) return;
  const temp = fields[index];
  fields[index] = fields[newIndex];
  fields[newIndex] = temp;
  if (selectedIndex === index) selectedIndex = newIndex;
  else if (selectedIndex === newIndex) selectedIndex = index;
  refreshUI();
}

function refreshUI() {
  renderFieldList();
  if (selectedIndex >= 0) {
    editorSection.style.display = 'block';
    validationSection.style.display = 'block';
    syncEditor();
  } else {
    editorSection.style.display = 'none';
    validationSection.style.display = 'none';
  }
  draw();
}

function renderFieldList() {
  if (fields.length === 0) {
    fieldListEl.innerHTML = '<div style="color:var(--text-secondary);font-size:13px;padding:8px 0;">暂无字段，在右侧图片上框选或点击“添加字段”</div>';
    return;
  }
  fieldListEl.innerHTML = fields.map((f, i) => `
    <div class="field-item ${i === selectedIndex ? 'active' : ''}" onclick="selectField(${i})">
      <span class="idx">${i + 1}</span>
      <span class="name">${escapeHtml(f.label || f.name)}</span>
      <div class="actions">
        <button onclick="moveField(${i}, -1, event)" title="上移">↑</button>
        <button onclick="moveField(${i}, 1, event)" title="下移">↓</button>
        <button onclick="deleteField(${i}, event)" title="删除">×</button>
      </div>
    </div>
  `).join('');
}

function syncEditor() {
  const f = fields[selectedIndex];
  if (!f) return;
  inputs.name.value = f.name || '';
  inputs.label.value = f.label || '';
  inputs.x.value = f.x.toFixed(4);
  inputs.y.value = f.y.toFixed(4);
  inputs.w.value = f.w.toFixed(4);
  inputs.h.value = f.h.toFixed(4);

  const v = f.validation || {};
  inputs.type.value = v.type || '';
  inputs.required.checked = !!v.required;
  inputs.min.value = v.min !== undefined ? v.min : '';
  inputs.max.value = v.max !== undefined ? v.max : '';
  inputs.pattern.value = v.pattern || '';
  inputs.options.value = v.options ? v.options.join(',') : '';
}

function readEditor() {
  const f = fields[selectedIndex];
  if (!f) return;
  f.name = inputs.name.value.trim() || f.name;
  f.label = inputs.label.value.trim();
  f.x = clamp(parseFloat(inputs.x.value) || 0, 0, 1);
  f.y = clamp(parseFloat(inputs.y.value) || 0, 0, 1);
  f.w = clamp(parseFloat(inputs.w.value) || 0.1, 0, 1 - f.x);
  f.h = clamp(parseFloat(inputs.h.value) || 0.1, 0, 1 - f.y);

  const v = {};
  if (inputs.type.value) v.type = inputs.type.value;
  if (inputs.required.checked) v.required = true;
  const min = inputs.min.value.trim();
  const max = inputs.max.value.trim();
  if (min !== '') v.min = isNaN(Number(min)) ? min : Number(min);
  if (max !== '') v.max = isNaN(Number(max)) ? max : Number(max);
  const pattern = inputs.pattern.value.trim();
  if (pattern) v.pattern = pattern;
  const options = inputs.options.value.trim();
  if (options) v.options = options.split(',').map(s => s.trim()).filter(Boolean);
  f.validation = v;
}

Object.values(inputs).forEach(el => {
  el.addEventListener('input', () => {
    readEditor();
    renderFieldList();
    draw();
  });
});

function parseJsonArray(text, label) {
  const trimmed = (text || '').trim();
  if (!trimmed) return [];
  try {
    const arr = JSON.parse(trimmed);
    if (!Array.isArray(arr)) throw new Error(label + ' 必须是 JSON 数组');
    return arr;
  } catch (e) {
    throw new Error(label + ' JSON 格式错误: ' + e.message);
  }
}

function buildConfig() {
  const config = {
    comment: "x/y/w/h 均为相对于矫正后表格正视图的 0~1 比例坐标",
    fields: [],
    validation: {},
    db_lookups: parseJsonArray(advDbLookupsEl.value, '数据库查询'),
    cross_field_rules: parseJsonArray(advCrossRulesEl.value, '跨字段比较')
  };
  for (const f of fields) {
    config.fields.push({
      name: f.name,
      label: f.label,
      x: Number(f.x.toFixed(6)),
      y: Number(f.y.toFixed(6)),
      w: Number(f.w.toFixed(6)),
      h: Number(f.h.toFixed(6))
    });
    if (f.validation && Object.keys(f.validation).length) {
      config.validation[f.name] = f.validation;
    }
  }
  return config;
}

async function saveConfig() {
  hideMsg();
  const config = buildConfig();
  try {
    const res = await fetch('/api/ocr/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config)
    });
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.error || ('HTTP ' + res.status));
    showMsg('配置已保存到服务器', 'success');
  } catch (err) {
    showMsg('保存失败：' + err.message, 'error');
  }
}

async function loadConfig() {
  hideMsg();
  try {
    const res = await fetch('/api/ocr/config');
    const data = await res.json();
    if (!res.ok || !data.success) throw new Error(data.error || ('HTTP ' + res.status));
    applyConfig(data.config);
    showMsg('配置已加载', 'success');
  } catch (err) {
    showMsg('加载失败：' + err.message, 'error');
  }
}

function applyConfig(config) {
  const validation = config.validation || {};
  fields = (config.fields || []).map(f => ({
    name: f.name,
    label: f.label,
    x: f.x, y: f.y, w: f.w, h: f.h,
    validation: validation[f.name] || {}
  }));
  selectedIndex = fields.length ? 0 : -1;

  advDbLookupsEl.value = JSON.stringify(config.db_lookups || [], null, 2);
  advCrossRulesEl.value = JSON.stringify(config.cross_field_rules || [], null, 2);

  refreshUI();
}

function exportJson() {
  const config = buildConfig();
  const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'fields.json';
  a.click();
  URL.revokeObjectURL(url);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;"','\'':'&#39;'}[c]));
}

window.addEventListener('resize', () => { fitCanvas(); });

loadUser();
</script>
