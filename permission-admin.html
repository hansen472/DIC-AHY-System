<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>权限管理 - 数智中心</title>
<link rel="icon" href="http://172.19.40.91/images/Favicon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; padding: 20px; color: #333; }
.container { max-width: 1200px; margin: 0 auto; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
h1 { font-size: 22px; color: #2c3e50; }
button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: #2b6cb0; color: #fff; }
.btn-success { background: #38a169; color: #fff; }
.btn-secondary { background: #e2e8f0; color: #333; }
.btn-danger { background: #e53e3e; color: #fff; }
.meta-text { color: #718096; font-size: 13px; }
.card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.card h2 { font-size: 16px; margin-bottom: 16px; color: #2c3e50; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #edf2f7; }
th { background: #f7fafc; font-weight: 600; color: #4a5568; }
tr:hover td { background: #f7fafc; }
tr.selected td { background: #ebf4ff !important; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.badge-active { background: #c6f6d5; color: #22543d; }
.badge-inactive { background: #edf2f7; color: #4a5568; }
.message { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; display: none; }
.message.success { background: #c6f6d5; color: #22543d; display: block; }
.message.error { background: #fed7d7; color: #742a2a; display: block; }
.empty { text-align: center; color: #a0aec0; padding: 40px 0; }
.permission-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 8px; }
.permission-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border: 1px solid #e2e8f0; border-radius: 8px;
  background: #fafbfc; cursor: pointer; transition: all 0.15s;
}
.permission-item:hover { border-color: #cbd5e0; background: #f7fafc; }
.permission-item input { width: 18px; height: 18px; cursor: pointer; }
.permission-item label { cursor: pointer; font-size: 14px; color: #2d3748; }
.permission-desc { font-size: 12px; color: #718096; margin-top: 4px; }
.admin-tip { padding: 14px; background: #ebf8ff; border-radius: 8px; color: #2b6cb0; font-size: 14px; }
.user-meta { color: #718096; font-size: 13px; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>权限管理</h1>
    <div>
      <span id="current-user" style="font-size:13px; color:#4a5568; margin-right:12px;"></span>
      <button class="btn-secondary" onclick="window.location.href='/'">返回导航</button>
    </div>
  </header>

  <div id="global-message" class="message"></div>

  <div class="card">
    <h2>用户列表</h2>
    <div id="user-list">加载中...</div>
  </div>

  <div class="card" id="permission-panel" style="display:none;">
    <h2>功能权限配置</h2>
    <div class="user-meta" id="selected-user-info"></div>
    <div id="admin-notice" class="admin-tip" style="display:none;">该用户为管理员，默认拥有所有功能权限，无需单独配置。</div>
    <div id="permission-form">
      <div class="permission-grid" id="permission-grid"></div>
      <div style="margin-top:20px;">
        <button class="btn-success" id="btn-save" onclick="savePermissions()">保存权限</button>
      </div>
    </div>
  </div>
</div>

<script>
const FEATURES = [
  { key: 'print', label: '生产记录打印', desc: '进入生产记录打印页面并执行打印' },
  { key: 'logs', label: '打印记录查询', desc: '查看打印历史日志' },
  { key: 'dashboard', label: '数字大屏', desc: '查看数字大屏展示' },
  { key: 'template_admin', label: '模板版本管理', desc: '管理模板版本、CSS 及升级' },
  { key: 'operation_logs', label: '操作日志', desc: '查看系统操作日志' },
  { key: 'training_records', label: '培训记录', desc: '培训记录录入、计划与用户培训记录' },
  {
    key: 'supplier_qualifications',
    label: '供应商资质',
    desc: '查看供应商资质信息',
    editKey: 'supplier_qualifications_edit',
    editLabel: '供应商资质编辑',
    editDesc: '新增、修改、删除供应商资质'
  },
  { key: 'workflow_design', label: '流程设计', desc: '使用可视化设计器配置审批流程模板' },
  { key: 'workflow_view_task', label: '查看全部待办', desc: '查看所有用户的审批待办任务' },
  { key: 'workflow_transfer_task', label: '转交审批任务', desc: '将审批任务转交给其他用户处理' },
  { key: 'workflow_recall_task', label: '撤回流程', desc: '撤回已发起的审批流程' },
  { key: 'instrument_meter', label: '仪器/仪表到期查询', desc: '查询 MIC 数据库中到期的仪器与仪表' }
];

let usersData = [];
let selectedUsername = null;
let currentPermissions = {};

async function init() {
  await loadUser();
  await loadUsers();
}

async function loadUser() {
  try {
    const res = await fetch('/api/session');
    if (res.ok) {
      const data = await res.json();
      if (data.success && data.username) {
        document.getElementById('current-user').textContent = '当前用户：' + data.username;
      }
    }
  } catch (e) {}
}

async function loadUsers() {
  try {
    const res = await fetch('/api/users');
    if (!res.ok) throw new Error('加载失败');
    const result = await res.json();
    usersData = result.data || [];
    renderUserList();
  } catch (err) {
    document.getElementById('user-list').innerHTML = '<div class="empty">加载失败：' + err.message + '</div>';
  }
}

function renderUserList() {
  if (usersData.length === 0) {
    document.getElementById('user-list').innerHTML = '<div class="empty">暂无用户数据</div>';
    return;
  }

  let html = `<table>
    <thead>
      <tr>
        <th>用户名</th>
        <th>状态</th>
        <th>最后登录</th>
        <th style="width:100px;">操作</th>
      </tr>
    </thead>
    <tbody>`;

  usersData.forEach(u => {
    const statusClass = u.status === 1 ? 'badge-active' : 'badge-inactive';
    const statusText = u.status === 1 ? '启用' : '禁用';
    const toggleText = u.status === 1 ? '禁用' : '启用';
    const toggleClass = u.status === 1 ? 'btn-danger' : 'btn-success';
    const isAdmin = u.username === 'admin';
    html += `
      <tr class="user-row" data-username="${escapeHtml(u.username)}" style="cursor:pointer;">
        <td>${escapeHtml(u.username)}</td>
        <td><span class="badge ${statusClass}">${statusText}</span></td>
        <td>${formatDate(u.last_login)}</td>
        <td>
          ${isAdmin ? '<span class="meta-text">管理员</span>' : `<button class="${toggleClass}" onclick="event.stopPropagation(); toggleUserStatus('${escapeHtml(u.username)}', ${u.status === 1 ? 0 : 1})" style="padding:4px 10px; font-size:12px;">${toggleText}</button>`}
        </td>
      </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('user-list').innerHTML = html;

  document.querySelectorAll('.user-row').forEach(row => {
    row.addEventListener('click', () => selectUser(row.dataset.username));
  });
}


async function selectUser(username) {
  selectedUsername = username;

  document.querySelectorAll('.user-row').forEach(tr => tr.classList.remove('selected'));
  const rows = document.querySelectorAll('.user-row');
  for (const row of rows) {
    if (row.dataset.username === username) {
      row.classList.add('selected');
      break;
    }
  }

  document.getElementById('permission-panel').style.display = 'block';
  document.getElementById('selected-user-info').textContent = '当前选中用户：' + escapeHtml(username);

  if (username === 'admin') {
    document.getElementById('admin-notice').style.display = 'block';
    document.getElementById('permission-form').style.display = 'none';
    return;
  }

  document.getElementById('admin-notice').style.display = 'none';
  document.getElementById('permission-form').style.display = 'block';

  try {
    const res = await fetch('/api/users/' + encodeURIComponent(username) + '/permissions');
    if (!res.ok) throw new Error('加载失败');
    const result = await res.json();
    currentPermissions = {};
    (result.data || []).forEach(item => {
      currentPermissions[item.feature_key] = item.is_allowed;
    });
    renderPermissionForm();
  } catch (err) {
    showMessage('加载权限失败：' + err.message, 'error');
  }
}

function renderPermissionForm() {
  const grid = document.getElementById('permission-grid');
  grid.innerHTML = '';

  FEATURES.forEach(f => {
    const checked = currentPermissions[f.key] === true ? 'checked' : '';
    const item = document.createElement('div');
    item.className = 'permission-item';
    item.style.flexDirection = 'column';
    item.style.alignItems = 'flex-start';

    let html = `
      <div style="display:flex; align-items:center; gap:10px;">
        <input type="checkbox" id="perm-${f.key}" value="${f.key}" ${checked} onchange="updatePermission('${f.key}')">
        <div>
          <label for="perm-${f.key}">${f.label}</label>
          <div class="permission-desc">${f.desc}</div>
        </div>
      </div>
    `;

    if (f.editKey) {
      const editChecked = currentPermissions[f.editKey] === true ? 'checked' : '';
      html += `
        <div style="display:flex; align-items:center; gap:10px; margin-top:10px; margin-left:28px;">
          <input type="checkbox" id="perm-${f.editKey}" value="${f.editKey}" ${editChecked} onchange="updatePermission('${f.editKey}')">
          <div>
            <label for="perm-${f.editKey}">${f.editLabel}</label>
            <div class="permission-desc">${f.editDesc}</div>
          </div>
        </div>
      `;
    }

    item.innerHTML = html;
    grid.appendChild(item);
  });
}

function updatePermission(key) {
  const cb = document.getElementById('perm-' + key);
  currentPermissions[key] = cb.checked;
}

async function savePermissions() {
  if (!selectedUsername) return;

  try {
    const res = await fetch('/api/users/' + encodeURIComponent(selectedUsername) + '/permissions', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ permissions: currentPermissions })
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '保存失败');
    showMessage('权限已保存', 'success');
  } catch (err) {
    showMessage('保存失败：' + err.message, 'error');
  }
}

function showMessage(text, type) {
  const el = document.getElementById('global-message');
  el.textContent = text;
  el.className = 'message ' + type;
  setTimeout(() => { el.className = 'message'; }, 4000);
}

async function toggleUserStatus(username, newStatus) {
  const actionText = newStatus === 1 ? '启用' : '禁用';
  if (!confirm(`确定要${actionText}用户 "${username}" 吗？`)) return;

  try {
    const res = await fetch('/api/users/' + encodeURIComponent(username) + '/status', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus })
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '操作失败');

    showMessage(result.message, 'success');
    await loadUsers();
  } catch (err) {
    showMessage('操作失败：' + err.message, 'error');
  }
}

function formatDate(str) {
  if (!str) return '-';
  const d = new Date(str);
  if (isNaN(d.getTime())) return str;
  return d.toLocaleString('zh-CN');
}

function escapeHtml(text) {
  if (!text) return '';
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

init();
</script>
</body>
</html>
