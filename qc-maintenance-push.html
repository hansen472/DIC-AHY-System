<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC维护计划推送 - 数智中心</title>
<link rel="icon" href="http://10.5.53.30/images/Favicon.png">
<style>
:root {
  --bg: #f3f5f8;
  --panel: #ffffff;
  --text: #1f2937;
  --text-secondary: #6b7280;
  --border: #e5e7eb;
  --primary: #1e40af;
  --primary-light: #dbeafe;
  --success: #047857;
  --danger: #dc2626;
  --wechat: #07c160;
  --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 24px;
}

.container { max-width: 1600px; margin: 0 auto; }

header {
  background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
  color: #fff;
  border-radius: 16px;
  padding: 28px 32px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  box-shadow: 0 10px 30px rgba(30, 64, 175, 0.18);
}

header h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
header p { font-size: 13px; color: #cbd5e1; margin-top: 6px; }

.btn-back {
  padding: 8px 20px;
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-size: 13px;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s;
}
.btn-back:hover { background: rgba(255,255,255,0.2); }

.card {
  background: var(--panel);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.card h2 { font-size: 16px; margin-bottom: 16px; color: var(--text); }

.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-secondary { background: #e2e8f0; color: #333; }
.btn-wechat { background: var(--wechat); color: #fff; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th { background: #f9fafb; font-weight: 600; color: #374151; white-space: nowrap; }
tr:hover td { background: #f9fafb; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.badge-green { background: #d1fae5; color: #065f46; }
.badge-yellow { background: #fef3c7; color: #92400e; }
.badge-blue { background: var(--primary-light); color: #1e40af; }
.badge-red { background: #fee2e2; color: #991b1b; }
.badge-gray { background: #f3f4f6; color: #374151; }

.message { padding: 10px 14px; border-radius: 6px; margin-bottom: 16px; display: none; }
.message.success { background: #d1fae5; color: #065f46; display: block; }
.message.error { background: #fee2e2; color: #991b1b; display: block; }

.empty { text-align: center; color: var(--text-secondary); padding: 40px 0; }

.stat-bar { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-item { background: #f9fafb; border: 1px solid var(--border); border-radius: 10px; padding: 14px 24px; min-width: 140px; }
.stat-item .label { font-size: 12px; color: var(--text-secondary); }
.stat-item .value { font-size: 24px; font-weight: 700; color: var(--text); margin-top: 4px; }

.sql-editor-wrap { margin-top: 12px; }
.sql-editor-wrap textarea {
  width: 100%; min-height: 200px; padding: 12px 16px;
  border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: var(--mono); resize: vertical; line-height: 1.6;
  background: #f9fafb;
}
.sql-editor-wrap textarea:focus { outline: none; border-color: var(--primary); background: #fff; }

.log-area {
  max-height: 200px; overflow-y: auto;
  background: #0f172a; color: #a0e8af; border-radius: 8px;
  padding: 14px 18px; font-size: 12px; font-family: var(--mono); line-height: 1.8;
}
.log-area .log-error { color: #fca5a5; }
.log-area .log-info { color: #93c5fd; }
.log-area .log-time { color: #64748b; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>QC维护计划推送</h1>
      <p>查询 MIC 数据库中 QC 维护计划待执行工单，推送到企业微信群</p>
    </div>
    <a href="/nav-sidebar.html" class="btn-back">← 返回导航</a>
  </header>

  <div id="global-message" class="message"></div>

  <div class="card">
    <div class="stat-bar">
      <div class="stat-item"><div class="label">待执行工单数</div><div class="value" id="stat-total">-</div></div>
      <div class="stat-item"><div class="label">查询时间</div><div class="value" id="stat-time" style="font-size:14px;">-</div></div>
    </div>
    <div class="toolbar">
      <button class="btn-primary" onclick="loadData()">刷新数据</button>
      <button class="btn-wechat" onclick="pushToWechat()">推送到企业微信</button>
      <button class="btn-secondary" onclick="toggleSqlEditor()">编辑 SQL</button>
    </div>
    <div class="sql-editor-wrap" id="sql-editor-wrap" style="display:none;">
      <textarea id="sql-editor"></textarea>
      <div style="margin-top:8px; display:flex; gap:10px; align-items:center;">
        <button class="btn-primary" onclick="applySql()" style="padding:6px 14px; font-size:13px;">应用并查询</button>
        <button class="btn-secondary" onclick="resetSql()" style="padding:6px 14px; font-size:13px;">恢复默认</button>
        <span style="font-size:12px; color:var(--text-secondary);">修改 SQL 后点击"应用并查询"刷新数据</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>QC维护计划工单列表</h2>
    <div id="data-table">加载中...</div>
  </div>

  <div class="card">
    <h2>推送日志</h2>
    <div class="log-area" id="log-area"><span class="log-time">系统就绪，等待操作...</span></div>
  </div>
</div>

<script>
let tableData = [];
let defaultSql = '';
let currentSql = '';

async function init() {
  await loadDefaultSql();
  await loadData();
}

async function loadDefaultSql() {
  try {
    const res = await fetch('/api/qc-maintenance/sql');
    if (res.ok) {
      const result = await res.json();
      defaultSql = result.sql || '';
      currentSql = defaultSql;
      document.getElementById('sql-editor').value = currentSql;
    }
  } catch (e) {}
}

async function loadData() {
  try {
    const body = currentSql ? { sql: currentSql } : {};
    const res = await fetch('/api/qc-maintenance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error || '查询失败');
    }
    const result = await res.json();
    tableData = result.data || [];
    renderTable();
    document.getElementById('stat-total').textContent = result.total || tableData.length;
    document.getElementById('stat-time').textContent = new Date().toLocaleString('zh-CN');
    appendLog('info', `查询完成，共 ${result.total || tableData.length} 条记录`);
  } catch (err) {
    document.getElementById('data-table').innerHTML = '<div class="empty">查询失败：' + escapeHtml(err.message) + '</div>';
    appendLog('error', '查询失败：' + err.message);
  }
}

function renderTable() {
  if (tableData.length === 0) {
    document.getElementById('data-table').innerHTML = '<div class="empty">暂无待执行的 QC 维护计划工单</div>';
    return;
  }

  let html = `<table>
    <thead><tr>
      <th>#</th><th>PM编码</th><th>设备</th><th>PM名称</th><th>负责人</th><th>状态</th><th>计划执行时间</th>
    </tr></thead><tbody>`;

  tableData.forEach((row, i) => {
    const statusBadge = getStatusBadge(row.状态);
    html += `<tr>
      <td>${i + 1}</td>
      <td>${escapeHtml(row['PM编码'] || '')}</td>
      <td>${escapeHtml(row['设备'] || '')}</td>
      <td>${escapeHtml(row['PM名称'] || '')}</td>
      <td>${escapeHtml(row['负责人'] || '')}</td>
      <td>${statusBadge}</td>
      <td>${escapeHtml(row['计划执行时间'] || '-')}</td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('data-table').innerHTML = html;
}

function getStatusBadge(status) {
  const map = {
    '闲置': 'badge-gray',
    '活跃': 'badge-green',
    '已搁置': 'badge-red'
  };
  const cls = map[status] || 'badge-gray';
  return `<span class="badge ${cls}">${escapeHtml(status || '-')}</span>`;
}

async function pushToWechat() {
  if (tableData.length === 0) {
    showMessage('暂无数据可推送', 'error');
    return;
  }
  if (!confirm(`确定要推送 ${tableData.length} 条 QC 维护计划工单到企业微信吗？`)) return;

  try {
    appendLog('info', '正在推送到企业微信...');
    const res = await fetch('/api/qc-maintenance/push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ data: tableData, total: tableData.length })
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '推送失败');
    showMessage('推送成功', 'success');
    appendLog('info', `推送成功：共 ${result.batch_count || 1} 批，${tableData.length} 条记录`);
  } catch (err) {
    showMessage('推送失败：' + err.message, 'error');
    appendLog('error', '推送失败：' + err.message);
  }
}

function toggleSqlEditor() {
  const wrap = document.getElementById('sql-editor-wrap');
  wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
}

function applySql() {
  currentSql = document.getElementById('sql-editor').value.trim();
  loadData();
}

function resetSql() {
  currentSql = defaultSql;
  document.getElementById('sql-editor').value = defaultSql;
  loadData();
}

function appendLog(type, msg) {
  const area = document.getElementById('log-area');
  const time = new Date().toLocaleTimeString('zh-CN');
  const cls = type === 'error' ? 'log-error' : 'log-info';
  area.innerHTML += `\n<span class="log-time">[${time}]</span> <span class="${cls}">${escapeHtml(msg)}</span>`;
  area.scrollTop = area.scrollHeight;
}

function showMessage(text, type) {
  const el = document.getElementById('global-message');
  el.textContent = text;
  el.className = 'message ' + type;
  setTimeout(() => { el.className = 'message'; }, 4000);
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

init();
</script>
</body>
</html>
