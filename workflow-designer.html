<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>流程设计器 - 数智中心</title>
<link rel="icon" href="http://172.19.40.91/images/Favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsPlumb/2.15.6/js/jsplumb.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", sans-serif; background: #f5f7fa; height: 100vh; overflow: hidden; color: #333; }
header {
  height: 56px; background: #fff; border-bottom: 1px solid #e2e8f0;
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
}
h1 { font-size: 18px; color: #2c3e50; }
button {
  padding: 7px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; transition: opacity 0.2s;
}
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: #2b6cb0; color: #fff; }
.btn-success { background: #38a169; color: #fff; }
.btn-secondary { background: #e2e8f0; color: #333; }
.btn-warning { background: #dd6b20; color: #fff; }
.btn-danger { background: #e53e3e; color: #fff; }
.toolbar { display: flex; gap: 8px; align-items: center; }
.toolbar .group { display: flex; gap: 6px; align-items: center; padding: 0 8px; border-left: 1px solid #e2e8f0; }

.main { display: flex; height: calc(100vh - 56px); }

.palette {
  width: 160px; background: #fff; border-right: 1px solid #e2e8f0; padding: 16px 12px;
}
.palette h3 { font-size: 14px; color: #4a5568; margin-bottom: 12px; }
.palette-item {
  padding: 10px; border: 1px dashed #cbd5e0; border-radius: 8px; margin-bottom: 10px;
  text-align: center; font-size: 13px; color: #4a5568; cursor: pointer; background: #f7fafc;
}
.palette-item:hover { background: #edf2f7; border-color: #2b6cb0; }

.canvas-wrap {
  flex: 1; position: relative; overflow: hidden; background: #f5f7fa;
  background-image: radial-gradient(#cbd5e0 1px, transparent 1px); background-size: 20px 20px;
}
#canvas { position: relative; width: 100%; height: 100%; }

.properties {
  width: 280px; background: #fff; border-left: 1px solid #e2e8f0; padding: 16px; overflow-y: auto;
}
.properties h3 { font-size: 15px; color: #2c3e50; margin-bottom: 14px; }
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 12px; color: #718096; margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 13px;
}
.form-group textarea { resize: vertical; min-height: 60px; }
.empty-tip { color: #a0aec0; font-size: 13px; text-align: center; margin-top: 40px; }

.message {
  position: fixed; top: 70px; left: 50%; transform: translateX(-50%);
  padding: 10px 18px; border-radius: 6px; font-size: 13px; display: none; z-index: 2000;
}
.message.success { background: #c6f6d5; color: #22543d; display: block; }
.message.error { background: #fed7d7; color: #742a2a; display: block; }

.node {
  position: absolute; width: 140px; padding: 10px 8px; border-radius: 8px;
  font-size: 13px; text-align: center; cursor: move; user-select: none;
  box-shadow: 0 2px 6px rgba(0,0,0,0.08); border: 2px solid transparent;
}
.node:hover { box-shadow: 0 4px 10px rgba(0,0,0,0.12); }
.node.selected { border-color: #2b6cb0; }
.node-start { background: #c6f6d5; color: #22543d; }
.node-approval { background: #ebf8ff; color: #2b6cb0; }
.node-condition { background: #fefcbf; color: #744210; }
.node-end { background: #fed7d7; color: #742a2a; }
/* 文本描述：纯标注节点，虚线边框、左对齐、可换行，不参与流程连线 */
.node-text { background: #fdf6e3; color: #6b4f1d; width: 200px; text-align: left; border: 2px dashed #d9c48a; }
.node-text .node-text-content {
  white-space: pre-wrap; word-break: break-word;
  font-size: 12px; line-height: 1.5; min-height: 18px;
}
.node-text .node-text-content.placeholder { color: #b8a37a; }
.node-type-label { font-size: 11px; opacity: 0.8; margin-top: 2px; }

.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
  display: none; align-items: center; justify-content: center; z-index: 1500;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fff; border-radius: 10px; width: 90%; max-width: 420px; padding: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15);
}
.modal h3 { font-size: 15px; margin-bottom: 14px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

/* 审批人选择器 */
.assignees-row { display: flex; gap: 6px; }
.assignees-row input { flex: 1; }
.btn-pick-user {
  white-space: nowrap; background: #2b6cb0; color: #fff; font-size: 12px;
  padding: 8px 10px; border-radius: 6px; flex-shrink: 0;
}
.up-modal { max-width: 460px; }
.up-search {
  width: 100%; padding: 8px 10px; border: 1px solid #e2e8f0; border-radius: 6px;
  font-size: 13px; margin-bottom: 12px;
}
.up-role-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 8px;
  cursor: pointer; background: #f7fafc;
}
.up-role-item:hover { background: #edf2f7; }
.up-role-item.selected { border-color: #2b6cb0; background: #ebf8ff; }
.up-role-badge {
  display: inline-block; background: #805ad5; color: #fff; font-size: 11px;
  padding: 2px 8px; border-radius: 9999px; font-weight: 600;
}
.up-role-desc { font-size: 12px; color: #718096; margin-left: auto; }
.up-list { max-height: 300px; overflow-y: auto; }
.up-user-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border: 1px solid #e2e8f0; border-radius: 6px; margin-bottom: 6px;
  cursor: pointer; transition: background 0.15s;
}
.up-user-item:hover { background: #f7fafc; }
.up-user-item.selected { border-color: #2b6cb0; background: #ebf8ff; }
.up-user-item input[type="checkbox"] { accent-color: #2b6cb0; flex-shrink: 0; }
.up-user-name { font-size: 13px; font-weight: 500; }
.up-user-meta { font-size: 11px; color: #a0aec0; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <h1>审批流设计器</h1>
  <div class="toolbar">
    <div class="group">
      <input id="def-name" placeholder="流程名称" style="width:140px; padding:6px 8px; border:1px solid #e2e8f0; border-radius:6px; font-size:13px;">
      <select id="def-module" style="padding:6px 8px; border:1px solid #e2e8f0; border-radius:6px; font-size:13px;">
        <option value="supplier_qualifications">供应商资质</option>
        <option value="training_records">培训记录</option>
        <option value="deviation_reports">偏差上报</option>
      </select>
      <input id="def-condition" placeholder="触发条件（可选）" title="例如：category == 'production'" style="width:140px; padding:6px 8px; border:1px solid #e2e8f0; border-radius:6px; font-size:13px;">
      <input id="def-priority" type="number" value="0" min="0" title="优先级，数值越大越优先" style="width:70px; padding:6px 8px; border:1px solid #e2e8f0; border-radius:6px; font-size:13px;">
    </div>
    <div class="group">
      <button class="btn-secondary" onclick="newFlow()">新建</button>
      <button class="btn-primary" onclick="saveFlow()">保存</button>
      <button class="btn-secondary" onclick="saveAsFlow()">另存为</button>
      <button class="btn-success" onclick="activateFlow()">启用</button>
    </div>
    <div class="group">
      <button class="btn-secondary" onclick="autoLayout()">自动布局</button>
      <button class="btn-secondary" onclick="undo()" id="btn-undo">撤销</button>
      <button class="btn-secondary" onclick="redo()" id="btn-redo">重做</button>
    </div>
    <div class="group">
      <button class="btn-secondary" onclick="window.location.href='/'">返回导航</button>
    </div>
  </div>
</header>

<div class="main">
  <div class="palette">
    <h3>节点类型</h3>
    <div class="palette-item" onclick="addNode('start')">⏺ 开始</div>
    <div class="palette-item" onclick="addNode('approval')">👤 审批</div>
    <div class="palette-item" onclick="addNode('condition')">🔀 条件</div>
    <div class="palette-item" onclick="addNode('end')">🏁 结束</div>
    <div class="palette-item" onclick="addNode('text')">📝 文本描述</div>
    <div style="margin-top:20px; padding-top:14px; border-top:1px solid #e2e8f0; font-size:12px; color:#718096;">
      提示：拖拽节点可调整位置；从节点右侧拖到另一节点左侧即可连线。
    </div>
  </div>

  <div class="canvas-wrap" id="canvas-wrap">
    <div id="canvas"></div>
  </div>

  <div class="properties">
    <h3>属性面板</h3>
    <div id="prop-empty" class="empty-tip">选中节点或连线以编辑属性</div>
    <div id="prop-form" style="display:none;">
      <div class="form-group" id="pg-name">
        <label>节点名称</label>
        <input type="text" id="inp-name" oninput="updateSelectedNode()">
      </div>
      <div class="form-group" id="pg-text">
        <label>节点描述（文本描述节点）</label>
        <textarea id="inp-text" onchange="updateSelectedNode()" placeholder="填写该节点的描述说明，画布上对应节点会实时显示此内容"></textarea>
      </div>
      <div class="form-group" id="pg-assignees">
        <label>审批人（逗号分隔，支持 [部门经理]、[变量:xxx]）</label>
        <div class="assignees-row">
          <input type="text" id="inp-assignees" onchange="updateSelectedNode()">
          <button class="btn-pick-user" onclick="openUserPicker()">选择人员</button>
        </div>
      </div>
      <div class="form-group" id="pg-mode">
        <label>会签模式</label>
        <select id="inp-mode" onchange="updateSelectedNode()">
          <option value="all">会签（全部通过）</option>
          <option value="any">或签（任一通过）</option>
          <option value="ratio">比例通过</option>
        </select>
      </div>
      <div class="form-group" id="pg-ratio">
        <label>通过比例（0~1）</label>
        <input type="number" id="inp-ratio" min="0" max="1" step="0.1" onchange="updateSelectedNode()">
      </div>
      <div class="form-group" id="pg-due">
        <label>审批时限（小时）</label>
        <input type="number" id="inp-due" min="0" step="1" onchange="updateSelectedNode()">
      </div>
      <div class="form-group" id="pg-form-fields">
        <label>节点表单（审批人提交时填写）</label>
        <div id="ff-list"></div>
        <button type="button" class="btn-secondary" onclick="addFormField()" style="width:100%; margin-top:6px; font-size:12px;">+ 添加字段</button>
      </div>
      <div class="form-group" id="pg-condition">
        <label>条件表达式</label>
        <textarea id="inp-condition" onchange="updateSelectedNode()" placeholder="例如：amount > 1000 && category == 'production'"></textarea>
      </div>
      <div class="form-group" id="pg-edge-label">
        <label>连线标签</label>
        <select id="inp-edge-label" onchange="updateSelectedEdge()">
          <option value="">默认（通过）</option>
          <option value="approve">通过</option>
          <option value="reject">驳回</option>
          <option value="true">条件成立</option>
          <option value="false">条件不成立</option>
        </select>
      </div>
      <button class="btn-danger" onclick="deleteSelected()" style="width:100%;">删除选中</button>
    </div>
  </div>
</div>

<div id="message" class="message"></div>

<div id="save-modal" class="modal-overlay">
  <div class="modal">
    <h3>另存为流程</h3>
    <div class="form-group">
      <label>流程名称</label>
      <input type="text" id="save-as-name" style="width:100%;">
    </div>
    <div class="form-group">
      <label>版本号</label>
      <input type="number" id="save-as-version" value="1" min="1" style="width:100%;">
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeSaveModal()">取消</button>
      <button class="btn-primary" onclick="confirmSaveAs()">确定</button>
    </div>
  </div>
</div>

<div id="user-picker-modal" class="modal-overlay">
  <div class="modal up-modal">
    <h3>选择审批人</h3>
    <input type="text" id="up-search" class="up-search" placeholder="搜索用户名或姓名..." oninput="filterUserPicker()">
    <div id="up-virtual-roles"></div>
    <div id="up-user-list" class="up-list"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeUserPicker()">取消</button>
      <button class="btn-primary" onclick="confirmUserPicker()">确定</button>
    </div>
  </div>
</div>

<script>
let jpInstance = null;
let nodes = [];
let edges = [];
let definitionId = null;
let undoStack = [];
let redoStack = [];
let selectedNodeId = null;
let selectedEdge = null;
let isRestoring = false;

const NODE_COLORS = {
  start: '#c6f6d5',
  approval: '#ebf8ff',
  condition: '#fefcbf',
  end: '#fed7d7'
};

function init() {
  initJsPlumb();
  loadUser();
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  if (id) loadDefinition(id);
  window.addEventListener('beforeunload', cleanupJsPlumb);
}

function initJsPlumb() {
  jsPlumb.ready(function() {
    jpInstance = jsPlumb.getInstance({
      Container: 'canvas',
      Connector: ['Bezier', { curviness: 60 }],
      PaintStyle: { stroke: '#a0aec0', strokeWidth: 2 },
      EndpointStyle: { fill: '#a0aec0', radius: 5 },
      HoverPaintStyle: { stroke: '#2b6cb0', strokeWidth: 3 },
      ConnectionOverlays: [
        ['Arrow', { location: 1, width: 10, length: 10 }],
        ['Label', { location: 0.5, cssClass: 'connection-label' }]
      ],
      Anchors: ['Right', 'Left']
    });

    jpInstance.bind('connection', function(info) {
      if (isRestoring) return;
      const edge = {
        id: generateId('edge'),
        source: info.sourceId,
        target: info.targetId,
        label: ''
      };
      pushState();
      edges.push(edge);
      selectedNodeId = null;
      selectedEdge = edge;
      renderProperties();
    });

    jpInstance.bind('connectionDetached', function(info) {
      if (isRestoring) return;
      const sourceId = info.sourceId;
      const targetId = info.targetId;
      pushState();
      edges = edges.filter(e => !(e.source === sourceId && e.target === targetId));
      if (selectedEdge && selectedEdge.source === sourceId && selectedEdge.target === targetId) {
        selectedEdge = null;
      }
      renderProperties();
    });

    jpInstance.bind('click', function(conn, originalEvent) {
      if (!conn || !conn.sourceId) return;
      selectedNodeId = null;
      selectedEdge = edges.find(e => e.source === conn.sourceId && e.target === conn.targetId) || null;
      renderProperties();
    });
  });
}

function cleanupJsPlumb() {
  if (jpInstance) {
    jpInstance.destroy();
    jpInstance = null;
  }
}

function generateId(prefix) {
  return prefix + '-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
}

function getCanvasRect() {
  const wrap = document.getElementById('canvas-wrap');
  return wrap.getBoundingClientRect();
}

function addNode(type) {
  if (!jpInstance) return;
  const rect = getCanvasRect();
  const names = { start: '开始', approval: '审批', condition: '条件判断', end: '结束', text: '文本描述' };
  const node = {
    id: generateId('node'),
    type,
    name: names[type],
    x: rect.width / 2 - 70 + (nodes.length * 20) % 120,
    y: rect.height / 2 - 30 + (nodes.length * 20) % 120,
    config: {}
  };
  if (type === 'approval') {
    node.config = { assignees: [], approvalMode: 'all', ratio: 1, dueHours: 24, formFields: [] };
  }
  if (type === 'text') {
    node.config = { text: '' };
  }
  pushState();
  nodes.push(node);
  renderNode(node);
  selectNode(node.id);
}

function renderNode(node) {
  const el = document.createElement('div');
  el.id = node.id;
  el.className = `node node-${node.type}`;
  el.style.left = node.x + 'px';
  el.style.top = node.y + 'px';
  if (node.type === 'text') {
    // 文本描述节点：画布直接显示描述内容，未填写时显示占位提示
    const text = (node.config && node.config.text) || '';
    el.innerHTML = `<div class="node-text-content${text ? '' : ' placeholder'}">${escapeHtml(text || '（未填写描述）')}</div><div class="node-type-label">${typeLabel(node.type)}</div>`;
  } else {
    el.innerHTML = `<div>${escapeHtml(node.name)}</div><div class="node-type-label">${typeLabel(node.type)}</div>`;
  }
  document.getElementById('canvas').appendChild(el);

  jpInstance.draggable(el, {
    stop: function(params) {
      const n = nodes.find(x => x.id === node.id);
      if (n) {
        pushState();
        n.x = params.pos[0];
        n.y = params.pos[1];
      }
    }
  });

  // 文本描述为纯标注节点，不添加连线端点（不能接入流程，引擎不会遍历到它）
  if (node.type !== 'end' && node.type !== 'text') {
    jpInstance.addEndpoint(el, {
      anchor: 'Right',
      isSource: true,
      maxConnections: node.type === 'start' ? 1 : -1,
      endpoint: 'Dot',
      paintStyle: { fill: '#718096' },
      hoverPaintStyle: { fill: '#2b6cb0' }
    });
  }
  if (node.type !== 'start' && node.type !== 'text') {
    jpInstance.addEndpoint(el, {
      anchor: 'Left',
      isTarget: true,
      maxConnections: -1,
      endpoint: 'Dot',
      paintStyle: { fill: '#718096' },
      hoverPaintStyle: { fill: '#2b6cb0' }
    });
  }

  el.addEventListener('mousedown', function(e) {
    e.stopPropagation();
    selectNode(node.id);
  });
}

function typeLabel(type) {
  return { start: '开始', approval: '审批', condition: '条件', end: '结束', text: '文本描述' }[type] || type;
}

function selectNode(id) {
  selectedNodeId = id;
  selectedEdge = null;
  document.querySelectorAll('.node').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById(id);
  if (el) el.classList.add('selected');
  renderProperties();
}

function renderProperties() {
  const empty = document.getElementById('prop-empty');
  const form = document.getElementById('prop-form');
  if (!selectedNodeId && !selectedEdge) {
    empty.style.display = 'block';
    form.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  form.style.display = 'block';

  const pgName = document.getElementById('pg-name');
  const pgText = document.getElementById('pg-text');
  const pgAssignees = document.getElementById('pg-assignees');
  const pgMode = document.getElementById('pg-mode');
  const pgRatio = document.getElementById('pg-ratio');
  const pgDue = document.getElementById('pg-due');
  const pgCondition = document.getElementById('pg-condition');
  const pgFormFields = document.getElementById('pg-form-fields');
  const pgEdgeLabel = document.getElementById('pg-edge-label');

  if (selectedEdge) {
    [pgName, pgText, pgAssignees, pgMode, pgRatio, pgDue, pgCondition, pgFormFields].forEach(el => el.style.display = 'none');
    pgEdgeLabel.style.display = 'block';
    document.getElementById('inp-edge-label').value = selectedEdge.label || '';
    return;
  }

  pgEdgeLabel.style.display = 'none';
  const node = nodes.find(n => n.id === selectedNodeId);
  if (!node) return;

  pgName.style.display = 'block';
  document.getElementById('inp-name').value = node.name || '';

  if (node.type === 'text') {
    // 文本描述节点：只显示名称与描述内容编辑框
    [pgAssignees, pgMode, pgRatio, pgDue, pgCondition, pgFormFields].forEach(el => el.style.display = 'none');
    pgText.style.display = 'block';
    document.getElementById('inp-text').value = (node.config && node.config.text) || '';
    return;
  }
  pgText.style.display = 'none';

  if (node.type === 'approval') {
    pgAssignees.style.display = 'block';
    pgMode.style.display = 'block';
    pgDue.style.display = 'block';
    pgFormFields.style.display = 'block';
    document.getElementById('inp-assignees').value = (node.config.assignees || []).join(', ');
    document.getElementById('inp-mode').value = node.config.approvalMode || 'all';
    document.getElementById('inp-due').value = node.config.dueHours || '';
    const showRatio = (node.config.approvalMode || 'all') === 'ratio';
    pgRatio.style.display = showRatio ? 'block' : 'none';
    document.getElementById('inp-ratio').value = node.config.ratio || '';
    pgCondition.style.display = 'none';
    renderFormFields();
  } else if (node.type === 'condition') {
    pgAssignees.style.display = 'none';
    pgMode.style.display = 'none';
    pgRatio.style.display = 'none';
    pgDue.style.display = 'none';
    pgFormFields.style.display = 'none';
    pgCondition.style.display = 'block';
    document.getElementById('inp-condition').value = node.config.condition || '';
  } else {
    [pgAssignees, pgMode, pgRatio, pgDue, pgCondition, pgFormFields].forEach(el => el.style.display = 'none');
  }
}

function updateSelectedNode() {
  if (!selectedNodeId) return;
  const node = nodes.find(n => n.id === selectedNodeId);
  if (!node) return;
  pushState();
  node.name = document.getElementById('inp-name').value || node.name;
  if (node.type === 'text') {
    node.config.text = document.getElementById('inp-text').value;
  }
  if (node.type === 'approval') {
    const assigneesStr = document.getElementById('inp-assignees').value || '';
    node.config.assignees = assigneesStr.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    node.config.approvalMode = document.getElementById('inp-mode').value;
    node.config.dueHours = parseFloat(document.getElementById('inp-due').value) || null;
    node.config.ratio = parseFloat(document.getElementById('inp-ratio').value) || null;
  }
  if (node.type === 'condition') {
    node.config.condition = document.getElementById('inp-condition').value || '';
  }
  const el = document.getElementById(node.id);
  if (el) {
    if (node.type === 'text') {
      // 文本描述节点：实时刷新画布上的描述内容
      const content = el.querySelector('.node-text-content');
      const text = node.config.text || '';
      if (content) {
        content.textContent = text || '（未填写描述）';
        content.classList.toggle('placeholder', !text);
      }
    } else {
      el.firstChild.textContent = node.name;
    }
  }
  renderProperties();
}

function updateSelectedEdge() {
  if (!selectedEdge) return;
  pushState();
  selectedEdge.label = document.getElementById('inp-edge-label').value;
  renderConnections();
}

function deleteSelected() {
  pushState();
  if (selectedEdge) {
    jpInstance.deleteConnection(jpInstance.getConnections({ source: selectedEdge.source, target: selectedEdge.target })[0]);
    edges = edges.filter(e => e !== selectedEdge);
    selectedEdge = null;
  } else if (selectedNodeId) {
    jpInstance.remove(selectedNodeId);
    nodes = nodes.filter(n => n.id !== selectedNodeId);
    edges = edges.filter(e => e.source !== selectedNodeId && e.target !== selectedNodeId);
    selectedNodeId = null;
  }
  renderProperties();
}

function renderConnections() {
  if (!jpInstance) return;
  jpInstance.getConnections().forEach(conn => {
    const edge = edges.find(e => e.source === conn.sourceId && e.target === conn.targetId);
    if (edge && conn.getOverlay('Label')) {
      conn.getOverlay('Label').setLabel(edge.label || '');
    }
  });
}

function validateFlow() {
  const starts = nodes.filter(n => n.type === 'start');
  const ends = nodes.filter(n => n.type === 'end');
  if (starts.length !== 1) return '流程必须有且只有一个开始节点';
  if (ends.length !== 1) return '流程必须有且只有一个结束节点';

  const outgoingCount = {};
  const incomingCount = {};
  nodes.forEach(n => { outgoingCount[n.id] = 0; incomingCount[n.id] = 0; });
  edges.forEach(e => { outgoingCount[e.source]++; incomingCount[e.target]++; });

  for (const n of nodes) {
    // 文本描述为纯标注节点，不要求连线
    if (n.type === 'text') continue;
    if (n.type === 'start' && incomingCount[n.id] > 0) return '开始节点不能有进入连线';
    if (n.type === 'end' && outgoingCount[n.id] > 0) return '结束节点不能有出去连线';
    if (n.type !== 'end' && outgoingCount[n.id] === 0) return `节点 "${n.name}" 缺少出去连线`;
    if (n.type !== 'start' && incomingCount[n.id] === 0) return `节点 "${n.name}" 缺少进入连线`;
  }

  for (const n of nodes.filter(x => x.type === 'condition')) {
    const labels = edges.filter(e => e.source === n.id).map(e => (e.label || '').toLowerCase());
    if (!labels.includes('true') || !labels.includes('false')) {
      return `条件节点 "${n.name}" 必须同时有 true 和 false 两条连线`;
    }
  }

  return null;
}

async function saveFlow() {
  const error = validateFlow();
  if (error) return showMessage(error, 'error');

  const payload = buildPayload();
  try {
    let res;
    if (definitionId) {
      res = await fetch('/api/workflow-definitions/' + definitionId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } else {
      res = await fetch('/api/workflow-definitions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '保存失败');
    if (!definitionId && result.id) definitionId = result.id;
    showMessage('流程已保存', 'success');
  } catch (err) {
    showMessage('保存失败：' + err.message, 'error');
  }
}

function buildPayload() {
  return {
    module_key: document.getElementById('def-module').value,
    name: document.getElementById('def-name').value || '未命名流程',
    version: 1,
    condition: document.getElementById('def-condition').value || '',
    priority: parseInt(document.getElementById('def-priority').value, 10) || 0,
    nodes: nodes.map(n => ({ id: n.id, type: n.type, name: n.name, x: n.x, y: n.y, config: n.config })),
    edges: edges.map(e => ({ id: e.id, source: e.source, target: e.target, label: e.label }))
  };
}

function saveAsFlow() {
  const error = validateFlow();
  if (error) return showMessage(error, 'error');
  document.getElementById('save-as-name').value = document.getElementById('def-name').value + '_副本';
  document.getElementById('save-modal').classList.add('active');
}

function closeSaveModal() {
  document.getElementById('save-modal').classList.remove('active');
}

async function confirmSaveAs() {
  const name = document.getElementById('save-as-name').value;
  const version = parseInt(document.getElementById('save-as-version').value, 10) || 1;
  if (!name) return showMessage('请输入流程名称', 'error');

  const payload = buildPayload();
  payload.name = name;
  payload.version = version;
  try {
    const res = await fetch('/api/workflow-definitions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '另存为失败');
    definitionId = result.id;
    document.getElementById('def-name').value = name;
    closeSaveModal();
    showMessage('流程已另存为', 'success');
  } catch (err) {
    showMessage('另存为失败：' + err.message, 'error');
  }
}

async function activateFlow() {
  if (!definitionId) return showMessage('请先保存流程', 'error');
  try {
    const res = await fetch('/api/workflow-definitions/' + definitionId + '/activate', { method: 'POST' });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '启用失败');
    showMessage('流程已启用。同模块的默认（无条件）流程会互斥，有条件流程可共存', 'success');
  } catch (err) {
    showMessage('启用失败：' + err.message, 'error');
  }
}

async function loadDefinition(id) {
  try {
    const res = await fetch('/api/workflow-definitions/' + id);
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '加载失败');
    const def = result.data;
    definitionId = def.id;
    document.getElementById('def-name').value = def.name || '';
    document.getElementById('def-module').value = def.module_key || 'supplier_qualifications';
    document.getElementById('def-condition').value = def.condition || '';
    document.getElementById('def-priority').value = def.priority != null ? def.priority : 0;

    nodes = (def.nodes_json || []).map(n => ({
      id: n.id,
      type: n.type,
      name: n.name,
      x: n.x || 100,
      y: n.y || 100,
      config: n.config || {}
    }));
    edges = (def.edges_json || []).map(e => ({
      id: e.id,
      source: e.source,
      target: e.target,
      label: e.label || ''
    }));

    restoreCanvas();
  } catch (err) {
    showMessage('加载流程失败：' + err.message, 'error');
  }
}

function restoreCanvas() {
  if (!jpInstance) return;
  isRestoring = true;
  document.getElementById('canvas').innerHTML = '';
  jpInstance.deleteEveryEndpoint();
  nodes.forEach(renderNode);
  edges.forEach(e => {
    jpInstance.connect({ source: e.source, target: e.target });
  });
  renderConnections();
  isRestoring = false;
}

function newFlow() {
  pushState();
  definitionId = null;
  nodes = [];
  edges = [];
  document.getElementById('def-name').value = '';
  document.getElementById('def-condition').value = '';
  document.getElementById('def-priority').value = '0';
  restoreCanvas();
  showMessage('已新建空白流程', 'success');
}

function autoLayout() {
  if (nodes.length === 0) return;
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: 'LR', nodesep: 80, ranksep: 120 });
  g.setDefaultEdgeLabel(function() { return {}; });

  nodes.forEach(n => {
    // 文本描述节点不参与自动布局，保持在标注位置不动
    if (n.type !== 'text') g.setNode(n.id, { width: 140, height: 60 });
  });
  edges.forEach(e => {
    g.setEdge(e.source, e.target);
  });

  dagre.layout(g);

  pushState();
  g.nodes().forEach(id => {
    const n = nodes.find(x => x.id === id);
    const nodeInfo = g.node(id);
    if (n && nodeInfo) {
      n.x = nodeInfo.x - nodeInfo.width / 2;
      n.y = nodeInfo.y - nodeInfo.height / 2;
    }
  });
  restoreCanvas();
  showMessage('自动布局完成', 'success');
}

function pushState() {
  if (isRestoring) return;
  undoStack.push({ nodes: deepCopy(nodes), edges: deepCopy(edges) });
  if (undoStack.length > 50) undoStack.shift();
  redoStack = [];
  updateUndoRedoButtons();
}

function undo() {
  if (undoStack.length === 0) return;
  redoStack.push({ nodes: deepCopy(nodes), edges: deepCopy(edges) });
  const state = undoStack.pop();
  nodes = state.nodes;
  edges = state.edges;
  restoreCanvas();
  updateUndoRedoButtons();
}

function redo() {
  if (redoStack.length === 0) return;
  undoStack.push({ nodes: deepCopy(nodes), edges: deepCopy(edges) });
  const state = redoStack.pop();
  nodes = state.nodes;
  edges = state.edges;
  restoreCanvas();
  updateUndoRedoButtons();
}

function updateUndoRedoButtons() {
  document.getElementById('btn-undo').disabled = undoStack.length === 0;
  document.getElementById('btn-redo').disabled = redoStack.length === 0;
}

function deepCopy(obj) {
  return JSON.parse(JSON.stringify(obj));
}

function showMessage(text, type) {
  const el = document.getElementById('message');
  el.textContent = text;
  el.className = 'message ' + type;
  setTimeout(() => { el.className = 'message'; }, 4000);
}

function escapeHtml(text) {
  if (!text) return '';
  return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function loadUser() {
  try {
    const res = await fetch('/api/session');
    if (res.ok) {
      const data = await res.json();
      if (!data.success) window.location.href = '/login';
    }
  } catch (e) {
    window.location.href = '/login';
  }
}

// ========== 节点表单（formFields）编辑 ==========

// 表单字段类型：user/department 为动态数据源下拉，currentUser 提交时自动填充当前审批人
const FF_TYPES = [
  { value: 'text', label: '文本' },
  { value: 'textarea', label: '多行文本' },
  { value: 'select', label: '下拉（固定选项）' },
  { value: 'date', label: '日期' },
  { value: 'user', label: '用户下拉' },
  { value: 'department', label: '部门下拉' },
  { value: 'currentUser', label: '当前用户（只读）' }
];

// 获取当前选中审批节点的表单字段数组（无则初始化为空数组）
function getFormFields() {
  const node = nodes.find(n => n.id === selectedNodeId);
  if (!node || node.type !== 'approval') return null;
  if (!Array.isArray(node.config.formFields)) node.config.formFields = [];
  return node.config.formFields;
}

function renderFormFields() {
  const list = document.getElementById('ff-list');
  if (!list) return;
  const fields = getFormFields();
  if (fields === null) { list.innerHTML = ''; return; }
  if (fields.length === 0) {
    list.innerHTML = '<div style="font-size:12px;color:#a0aec0;">暂无字段（该节点审批人无需填写表单）</div>';
    return;
  }
  const inpStyle = 'flex:1; min-width:0; font-size:12px; padding:4px 6px; border:1px solid #e2e8f0; border-radius:4px;';
  list.innerHTML = fields.map((f, i) => {
    const isSelect = f.type === 'select';
    return `
      <div style="border:1px solid #e2e8f0; border-radius:6px; padding:8px; margin-bottom:8px; background:#f8fafc;">
        <div style="display:flex; gap:4px; margin-bottom:4px;">
          <input type="text" value="${escapeAttr(f.name)}" placeholder="变量名 如 handler" onchange="updateFormField(${i},'name',this.value)" style="${inpStyle}">
          <input type="text" value="${escapeAttr(f.label)}" placeholder="标签 如 处理人" onchange="updateFormField(${i},'label',this.value)" style="${inpStyle}">
        </div>
        <div style="display:flex; gap:4px; align-items:center;">
          <select onchange="updateFormField(${i},'type',this.value); renderFormFields();" style="${inpStyle}">
            ${FF_TYPES.map(t => `<option value="${t.value}" ${f.type === t.value ? 'selected' : ''}>${t.label}</option>`).join('')}
          </select>
          <label style="font-size:12px; display:flex; align-items:center; gap:2px; white-space:nowrap; cursor:pointer;">
            <input type="checkbox" ${f.required ? 'checked' : ''} onchange="updateFormField(${i},'required',this.checked)">必填
          </label>
          <button type="button" class="btn-danger" onclick="removeFormField(${i})" style="font-size:11px; padding:3px 8px;">删</button>
        </div>
        ${isSelect ? `<input type="text" value="${escapeAttr(f.options || '')}" placeholder="选项，逗号分隔 如：微小,中等,重大" onchange="updateFormField(${i},'options',this.value)" style="width:100%; margin-top:4px; ${inpStyle}">` : ''}
      </div>`;
  }).join('');
}

function addFormField() {
  const fields = getFormFields();
  if (!fields) return;
  pushState();
  fields.push({ name: '', label: '', type: 'text', options: '', required: false });
  renderFormFields();
}

function updateFormField(index, key, value) {
  const fields = getFormFields();
  if (!fields || !fields[index]) return;
  pushState();
  fields[index][key] = value;
}

function removeFormField(index) {
  const fields = getFormFields();
  if (!fields) return;
  pushState();
  fields.splice(index, 1);
  renderFormFields();
}

function escapeAttr(s) {
  return String(s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// ========== 审批人选择器 ==========
let userPickerUsers = [];   // 从接口获取的用户列表
let userPickerSelected = new Set(); // 当前已勾选的用户名
let virtualRoleSelected = false;    // “部门经理”虚拟角色是否选中

/**
 * 打开审批人选择弹窗
 */
async function openUserPicker() {
  // 预填当前审批人输入框中已有的用户名
  const currentVal = document.getElementById('inp-assignees').value || '';
  userPickerSelected = new Set(
    currentVal.split(/[,，]/).map(s => s.trim()).filter(Boolean)
  );
  virtualRoleSelected = userPickerSelected.has('[部门经理]');

  try {
    const res = await fetch('/api/users/simple-list');
    const result = await res.json();
    if (!res.ok || !result.success) throw new Error(result.error || '获取用户列表失败');
    userPickerUsers = result.users || [];
  } catch (err) {
    showMessage('获取用户列表失败：' + err.message, 'error');
    return;
  }

  // 渲染虚拟角色区
  const rolesDiv = document.getElementById('up-virtual-roles');
  rolesDiv.innerHTML = `
    <div class="up-role-item ${virtualRoleSelected ? 'selected' : ''}" id="up-role-mgr" onclick="toggleVirtualRole()">
      <input type="checkbox" ${virtualRoleSelected ? 'checked' : ''} onclick="event.stopPropagation(); toggleVirtualRole()">
      <span class="up-role-badge">部门经理</span>
      <span class="up-role-desc">运行时自动解析为发起人的直属经理</span>
    </div>
  `;

  // 渲染用户列表
  renderUserPickerList('');
  document.getElementById('up-search').value = '';
  document.getElementById('user-picker-modal').classList.add('active');
}

/**
 * 关闭选择弹窗
 */
function closeUserPicker() {
  document.getElementById('user-picker-modal').classList.remove('active');
}

/**
 * 渲染用户列表（支持搜索过滤）
 */
function renderUserPickerList(filter) {
  const listDiv = document.getElementById('up-user-list');
  const keyword = (filter || '').trim().toLowerCase();
  const filtered = userPickerUsers.filter(u =>
    !keyword ||
    u.username.toLowerCase().includes(keyword) ||
    (u.chinese_name && u.chinese_name.toLowerCase().includes(keyword)) ||
    (u.department && u.department.toLowerCase().includes(keyword))
  );

  if (filtered.length === 0) {
    listDiv.innerHTML = '<div style="text-align:center; color:#a0aec0; padding:20px; font-size:13px;">无匹配用户</div>';
    return;
  }

  listDiv.innerHTML = filtered.map(u => {
    const checked = userPickerSelected.has(u.username);
    const meta = [u.chinese_name, u.department].filter(Boolean).join(' · ');
    return `
      <div class="up-user-item ${checked ? 'selected' : ''}" onclick="toggleUserSelection('${escapeHtml(u.username)}')">
        <input type="checkbox" ${checked ? 'checked' : ''} onclick="event.stopPropagation(); toggleUserSelection('${escapeHtml(u.username)}')">
        <span class="up-user-name">${escapeHtml(u.username)}</span>
        ${meta ? `<span class="up-user-meta">${escapeHtml(meta)}</span>` : ''}
      </div>
    `;
  }).join('');
}

/**
 * 搜索框输入时过滤用户
 */
function filterUserPicker() {
  const keyword = document.getElementById('up-search').value;
  renderUserPickerList(keyword);
}

/**
 * 切换某个用户的选中状态
 */
function toggleUserSelection(username) {
  if (userPickerSelected.has(username)) {
    userPickerSelected.delete(username);
  } else {
    userPickerSelected.add(username);
  }
  // 重新渲染当前列表
  const keyword = document.getElementById('up-search').value;
  renderUserPickerList(keyword);
}

/**
 * 切换“部门经理”虚拟角色的选中状态
 */
function toggleVirtualRole() {
  virtualRoleSelected = !virtualRoleSelected;
  if (virtualRoleSelected) {
    userPickerSelected.add('[部门经理]');
  } else {
    userPickerSelected.delete('[部门经理]');
  }
  // 更新虚拟角色区的视觉状态
  const roleEl = document.getElementById('up-role-mgr');
  if (roleEl) {
    const cb = roleEl.querySelector('input[type="checkbox"]');
    if (cb) cb.checked = virtualRoleSelected;
    roleEl.classList.toggle('selected', virtualRoleSelected);
  }
}

/**
 * 确认选择，将勾选的用户写入审批人输入框
 */
function confirmUserPicker() {
  // 将选中的用户名（包括 [部门经理]）写入输入框
  const names = Array.from(userPickerSelected);
  document.getElementById('inp-assignees').value = names.join(', ');
  updateSelectedNode();
  closeUserPicker();
}

init();
</script>
