<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选择打印记录</title>
<link rel="icon" href="http://172.19.40.91/images/Favicon.png">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "SimSun", sans-serif; background: #f5f7fa; padding: 20px; color: #333; }
.container { max-width: 1200px; margin: 0 auto; }
.section { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
h2 { font-size: 18px; margin-bottom: 16px; color: #2c3e50; }
.toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
button { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: opacity 0.2s; }
button:hover { opacity: 0.85; }
button:disabled { opacity: 0.6; cursor: not-allowed; }
.btn-primary { background: #2b6cb0; color: #fff; }
.btn-success { background: #38a169; color: #fff; }
.btn-secondary { background: #e2e8f0; color: #333; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #edf2f7; }
th { background: #f7fafc; font-weight: 600; color: #4a5568; }
tr:hover td { background: #f7fafc; }
input[type="checkbox"] { cursor: pointer; width: 16px; height: 16px; }
.search-box { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; padding: 16px; background: #f7fafc; border-radius: 8px; border: 1px solid #e2e8f0; }
.search-box input[type="text"] { flex: 1; max-width: 320px; padding: 8px 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; outline: none; }
.search-box .search-status { font-size: 13px; color: #718096; margin-left: auto; }
.record-settings { display: none; }
.record-settings.active { display: block; }
.page-config { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #edf2f7; flex-wrap: wrap; }
.page-config label { flex: 1; font-size: 14px; min-width: 220px; }
</style>
</head>
<body>
<div class="container">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <div></div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span id="current-user" style="font-size:13px; color:#4a5568;"></span>
      <button class="btn-secondary" onclick="window.location.href='/'" style="padding:6px 14px; font-size:13px;">关闭</button>
    </div>
  </div>

  <div class="section">
    <h2>1. 产品信息查询</h2>
    <div class="search-box">
      <input type="text" id="order-input" placeholder="请输入单据编号" onkeydown="if(event.key==='Enter')searchByOrderId()">
      <button class="btn-primary" onclick="searchByOrderId()">查询</button>
      <span class="search-status" id="search-status"></span>
    </div>
  </div>

  <div class="section">
    <h2>2. 选择要录入的记录</h2>
    <div class="toolbar">
      <button class="btn-primary" onclick="selectAll(true)">全选</button>
      <button class="btn-secondary" onclick="selectAll(false)">取消全选</button>
      <button class="btn-success" onclick="confirmSelection()">选择</button>
      <span id="selected-count" style="margin-left:auto; color:#718096; font-size:14px;">已选 0 条</span>
    </div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="check-all" onclick="toggleSelectAll()"></th>
            <th>名称</th><th>生产任务号</th><th>规格</th><th>型号</th><th>配方</th><th>批次</th><th>备注</th>
          </tr>
        </thead>
        <tbody id="data-table"></tbody>
      </table>
    </div>
  </div>

  <div class="section record-settings" id="settings-panel">
    <h2>3. 选择记录</h2>
    
    <div id="page-config-list">
      <div class="page-config">
        <label><strong>配料工序生产记录</strong> — SOR-SC-003</label>
        <button class="btn-success" onclick="entryRecord()">录入</button>
      </div>
    </div>
  </div>

</div>

<script>
const SEARCH_API_URL = '/api/search';

let sourceData = [];
let lastQueryData = '';

(function initUser() {
  fetch('/api/session')
    .then(res => {
      if (res.status === 401) {
        window.location.href = '/login';
        throw new Error('未登录');
      }
      return res.json();
    })
    .then(data => {
      if (data.success && data.username) {
        document.getElementById('current-user').textContent = '当前用户：' + data.username;
      }
    })
    .catch(e => { if (e.message !== '未登录') console.error('获取用户信息失败:', e); });
})();

async function searchByOrderId() {
  const input = document.getElementById('order-input');
  const status = document.getElementById('search-status');
  const querydata = input.value.trim();
  if (!querydata) { status.textContent = '请输入查询内容'; status.style.color = '#c53030'; return; }

  status.textContent = '查询中...';
  status.style.color = '#2b6cb0';

  try {
    const res = await fetch(SEARCH_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ querydata })
    });
    if (!res.ok) {
      if (res.status === 401) {
        alert('登录已过期，请重新登录');
        window.location.href = '/login';
        return;
      }
      const errData = await res.json().catch(() => ({}));
      throw new Error(errData.error || '查询失败：' + res.status);
    }
    const data = await res.json();

    if (data.success && Array.isArray(data.data)) {
      sourceData = data.data;
      status.textContent = sourceData.length ? `找到 ${sourceData.length} 条结果` : '未找到匹配记录';
      status.style.color = sourceData.length ? '#38a169' : '#c53030';
      lastQueryData = querydata;
    } else {
      status.textContent = '查询失败：返回数据异常';
      status.style.color = '#c53030';
      sourceData = [];
      lastQueryData = '';
    }
    renderTable();
    document.getElementById('settings-panel').classList.remove('active');
  } catch (err) {
    console.error(err);
    status.textContent = '网络请求失败：' + err.message;
    status.style.color = '#c53030';
    sourceData = [];
    lastQueryData = '';
    renderTable();
  }
}

function renderTable() {
  const tbody = document.getElementById('data-table');
  if (!sourceData.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#a0aec0; padding:40px 0;">暂无数据</td></tr>';
    document.getElementById('check-all').checked = false;
    updateCount();
    return;
  }
  tbody.innerHTML = sourceData.map((row) => `
    <tr>
      <td><input type="checkbox" class="row-check" data-pici="${row.pici || ''}"></td>
      <td>${row.mingcheng || ''}</td>
      <td>${row.num || ''}</td>
      <td>${row.guige || ''}</td>
      <td>${row.xinghao || ''}</td>
      <td>${row.peifang || ''}</td>
      <td>${row.pici || ''}</td>
      <td>${row.beizhu || ''}</td>
    </tr>
  `).join('');
  document.querySelectorAll('.row-check').forEach(cb => cb.addEventListener('change', updateCount));
  updateCount();
}

function toggleSelectAll() { document.querySelectorAll('.row-check').forEach(cb => cb.checked = document.getElementById('check-all').checked); updateCount(); }
function selectAll(val) { document.getElementById('check-all').checked = val; document.querySelectorAll('.row-check').forEach(cb => cb.checked = val); updateCount(); }
function updateCount() { document.getElementById('selected-count').textContent = `已选 ${document.querySelectorAll('.row-check:checked').length} 条`; }

function confirmSelection() {
  if (!document.querySelectorAll('.row-check:checked').length) { alert('请至少勾选一条数据'); return; }
  document.getElementById('settings-panel').classList.add('active');
  window.scrollTo({ top: document.getElementById('settings-panel').offsetTop - 20, behavior: 'smooth' });
}

function entryRecord() {
  const checkedBoxes = document.querySelectorAll('.row-check:checked');
  if (!checkedBoxes.length) { alert('请至少勾选一条数据'); return; }

  const selectedPici = Array.from(checkedBoxes).map(cb => cb.dataset.pici).filter(Boolean);
  const selectedRows = sourceData.filter(row => selectedPici.includes(row.pici));

  sessionStorage.setItem('batchRecordSelectedRows', JSON.stringify(selectedRows));
  sessionStorage.setItem('batchRecordLastQueryData', lastQueryData);
  window.location.href = '/entry-print-record.html';
}
</script>
</body>
</html>
